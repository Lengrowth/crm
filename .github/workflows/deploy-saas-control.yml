name: Build and deploy SaaS control plane to staging

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Exact candidate ref to build and browser-validate (defaults to the workflow commit)
        required: false
        default: ""
        type: string
      rollout_stage:
        description: Rollout evidence stage recorded in the durable browser artifact
        required: false
        default: "operator-validation"
        type: choice
        options:
          - "operator-validation"
          - "general"
      phase1_shell_state:
        description: Staging-only shell state for candidate browser evidence
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - "on"

permissions:
  contents: read

concurrency:
  group: saas-control-staging-deploy
  cancel-in-progress: false

jobs:
  staging:
    name: Build one immutable candidate and deploy staging
    runs-on:
      - self-hosted
      - linux
      - saas-control
    environment: staging
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}
          fetch-depth: 0

      - name: Prepare current browser evidence harness
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_ref != '' }}
        run: |
          git fetch origin main --depth=1
          git show origin/main:frontend/scripts/capture_browser_evidence.mjs > "$RUNNER_TEMP/capture_browser_evidence.mjs"
          git show origin/main:scripts/release/prepare_staging_smoke_auth.py > "$RUNNER_TEMP/prepare_staging_smoke_auth.py"
          chmod a+r "$RUNNER_TEMP/capture_browser_evidence.mjs" "$RUNNER_TEMP/prepare_staging_smoke_auth.py"
          install -m 644 "$RUNNER_TEMP/capture_browser_evidence.mjs" "$GITHUB_WORKSPACE/frontend/scripts/current_capture_browser_evidence.mjs"
          install -m 644 "$RUNNER_TEMP/prepare_staging_smoke_auth.py" /tmp/saas-control-prepare-staging-smoke-auth.py

      - name: Make release scripts executable
        run: chmod +x scripts/release/*.sh scripts/deploy/*.sh

      - name: Use the supported Node.js runtime for the locked frontend toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Scan tracked and untracked candidate inputs for credential patterns
        run: python3 scripts/release/secret_scan.py

      - name: Remove only prior generated workspace outputs
        run: rm -rf -- "$GITHUB_WORKSPACE/frontend/node_modules" "$GITHUB_WORKSPACE/frontend/.next" "$GITHUB_WORKSPACE/staging-browser-evidence"

      - name: Retain only active and previous staging candidates
        run: |
          chmod +x scripts/release/prune_staging_releases.sh
          sudo scripts/release/prune_staging_releases.sh

      - name: Run candidate-bound validation suite
        env:
          SOURCE_REPO: ${{ github.workspace }}
          BACKEND_PYTHON: /opt/saas-control-staging/shared/backend-venv/bin/python
        run: |
          /opt/saas-control-staging/shared/backend-venv/bin/pip install --disable-pip-version-check --no-input 'pytest>=8,<9'
          ./scripts/release/validate_candidate.sh

      - name: Set staging-only shell flag for this candidate
        env:
          PHASE1_SHELL_STATE: ${{ inputs.phase1_shell_state || 'off' }}
        run: |
          case "$PHASE1_SHELL_STATE" in on|off) ;; *) echo "Invalid shell state" >&2; exit 1 ;; esac
          sudo python3 - /opt/saas-control-staging/shared/env/staging-backend.env "$PHASE1_SHELL_STATE" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          state = sys.argv[2]
          lines = path.read_text(encoding="utf-8").splitlines()
          output = []
          updated = False
          for line in lines:
              if line.startswith("FEATURE_FLAGS="):
                  entries = [entry for entry in line.removeprefix("FEATURE_FLAGS=").split(",") if entry and not entry.startswith("platform_phase1_shell=")]
                  entries.append(f"platform_phase1_shell={state}")
                  line = "FEATURE_FLAGS=" + ",".join(entries)
                  updated = True
              output.append(line)
          if not updated:
              output.append(f"FEATURE_FLAGS=platform_phase1_shell={state}")
          path.write_text("\n".join(output) + "\n", encoding="utf-8")
          PY

      - name: Build and deploy exact candidate to staging
        env:
          DEPLOY_TARGET: staging
          TARGET_REF: ${{ inputs.candidate_ref || github.sha }}
          RELEASE_ID: ${{ inputs.candidate_ref || github.sha }}
          REQUIRE_AUTH_SMOKE: "true"
        run: ./scripts/deploy/deploy_saas_control.sh

      - name: Install browser runtime for durable staging evidence
        run: /opt/saas-control-staging/current/frontend/node_modules/.bin/playwright install --with-deps chromium

      - name: Prepare disposable non-admin route test identity
        env:
          NON_ADMIN_SMOKE_EMAIL: phase1-non-admin-${{ github.run_id }}@example.test
        run: |
          sudo install -d -o saas-staging -g saas-staging -m 700 /run/saas-control-staging/smoke
          set -a
          . /opt/saas-control-staging/shared/env/staging-backend.env
          set +a
          auth_script="/opt/saas-control-staging/current/scripts/release/prepare_staging_smoke_auth.py"
          if [[ -f "/tmp/saas-control-prepare-staging-smoke-auth.py" ]]; then auth_script="/tmp/saas-control-prepare-staging-smoke-auth.py"; fi
          sudo -n -E -u saas-staging env \
            PYTHONPATH=/opt/saas-control-staging/current/backend \
            STAGING_SMOKE_EMAIL="$NON_ADMIN_SMOKE_EMAIL" \
            /opt/saas-control-staging/shared/backend-venv/bin/python \
            "$auth_script" \
            --token-file /run/saas-control-staging/smoke/non-admin-auth-token \
            --non-admin

      - name: Capture candidate-bound browser and accessibility evidence
        # Keep this capture step adjacent to the deployed release dependencies.
        env:
          EXPECTED_PHASE_ONE_SHELL: ${{ inputs.phase1_shell_state || 'off' }}
          EXPECTED_RELEASE: ${{ inputs.candidate_ref || github.sha }}
          RUNTIME_RELEASE_URL: http://127.0.0.1:18001/runtime/release
          ROLLOUT_STAGE: ${{ inputs.rollout_stage || 'operator-validation' }}
          HEADLESS: "false"
          BASE_URL: http://127.0.0.1:13001
          HOST_HEADER: staging.example.test
          OUTPUT_DIR: ${{ github.workspace }}/staging-browser-evidence
        run: |
          token_file="$RUNNER_TEMP/saas-staging-smoke-token"
          non_admin_token_file="$RUNNER_TEMP/saas-staging-non-admin-token"
          sudo install -m 600 -o "$(id -u)" -g "$(id -g)" /run/saas-control-staging/smoke/auth-token "$token_file"
          sudo install -m 600 -o "$(id -u)" -g "$(id -g)" /run/saas-control-staging/smoke/non-admin-auth-token "$non_admin_token_file"
          browser_path="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*/chrome*/chrome' -print -quit 2>/dev/null || true)"
          [[ -n "$browser_path" ]] || { echo "Installed Chromium executable was not found" >&2; exit 1; }
          evidence_script="/opt/saas-control-staging/current/frontend/scripts/capture_browser_evidence.mjs"
          if [[ -f "$GITHUB_WORKSPACE/frontend/scripts/current_capture_browser_evidence.mjs" ]]; then
            sudo install -m 644 "$GITHUB_WORKSPACE/frontend/scripts/current_capture_browser_evidence.mjs" /opt/saas-control-staging/current/frontend/scripts/current_capture_browser_evidence.mjs
            evidence_script="/opt/saas-control-staging/current/frontend/scripts/current_capture_browser_evidence.mjs"
          fi
          AUTH_TOKEN_FILE="$token_file" NON_ADMIN_AUTH_TOKEN_FILE="$non_admin_token_file" BROWSER_EXECUTABLE_PATH="$browser_path" node "$evidence_script"
          rm -f -- "$token_file" "$non_admin_token_file"

      - name: Remove disposable non-admin route test identity
        if: always()
        env:
          NON_ADMIN_SMOKE_EMAIL: phase1-non-admin-${{ github.run_id }}@example.test
        run: |
          set -a
          . /opt/saas-control-staging/shared/env/staging-backend.env
          set +a
          auth_script="/opt/saas-control-staging/current/scripts/release/prepare_staging_smoke_auth.py"
          if [[ -f "/tmp/saas-control-prepare-staging-smoke-auth.py" ]]; then auth_script="/tmp/saas-control-prepare-staging-smoke-auth.py"; fi
          sudo -n -E -u saas-staging env \
            PYTHONPATH=/opt/saas-control-staging/current/backend \
            /opt/saas-control-staging/shared/backend-venv/bin/python \
            "$auth_script" \
            --email "$NON_ADMIN_SMOKE_EMAIL" \
            --token-file /run/saas-control-staging/smoke/non-admin-auth-token \
            --cleanup
          sudo rm -f -- /run/saas-control-staging/smoke/non-admin-auth-token
          rm -f -- "$GITHUB_WORKSPACE/frontend/scripts/current_capture_browser_evidence.mjs" /tmp/saas-control-prepare-staging-smoke-auth.py
          sudo rm -f -- /opt/saas-control-staging/current/frontend/scripts/current_capture_browser_evidence.mjs

      - name: Remove exact Phase 2 synthetic browser records
        if: always()
        run: |
          cleanup_file="$GITHUB_WORKSPACE/staging-browser-evidence/phase2-cleanup.json"
          if [[ -f "$cleanup_file" ]]; then
            set -a
            . /opt/saas-control-staging/shared/env/staging-backend.env
            set +a
            sudo -n -E -u saas-staging env PYTHONPATH=/opt/saas-control-staging/current/backend \
              /opt/saas-control-staging/shared/backend-venv/bin/python \
              /opt/saas-control-staging/current/scripts/release/cleanup_phase2_synthetic.py \
              --file "$cleanup_file"
          else
            echo "No Phase 2 synthetic cleanup manifest was produced"
          fi

      - name: Upload durable staging browser evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: staging-browser-evidence-${{ inputs.candidate_ref || github.sha }}
          path: staging-browser-evidence
          if-no-files-found: error
          retention-days: 30
