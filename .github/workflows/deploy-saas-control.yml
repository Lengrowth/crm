name: Build and deploy SaaS control plane to staging

on:
  push:
    branches:
      - main
      - codex/phase3-unified-identity
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Exact candidate ref to build and browser-validate (defaults to the workflow commit)
        required: false
        default: ""
        type: string
      rollout_stage:
        description: Rollout evidence stage recorded in the durable browser artifact
        required: false
        default: "operator-validation"
        type: choice
        options:
          - "operator-validation"
          - "general"
      phase1_shell_state:
        description: Staging-only shell state for candidate browser evidence
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - "on"
      phase4_synthetic_state:
        description: Staging-only Phase 4 public/operator synthetic workflow state
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - "on"
      phase4_champion_workspace_state:
        description: Staging-only Champion role-based ERP workspace state
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - "on"
      phase3_identity_staging:
        description: Staging-only Phase 03 identity and cross-navigation rehearsal
        required: false
        default: "off"
        type: choice
        options:
          - "off"
          - "on"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: saas-control-staging-deploy
  cancel-in-progress: false

jobs:
  staging:
    name: Build one immutable candidate and deploy staging
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      - self-hosted
      - linux
      - saas-control
    environment: staging
    steps:
      - name: Repair runner workspace ownership before checkout
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_ref || github.sha }}
          fetch-depth: 0

      - name: Resolve immutable candidate commit
        id: candidate
        run: |
          candidate_sha="$(git rev-parse HEAD)"
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Candidate checkout is not a commit: $candidate_sha" >&2; exit 1; }
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Verify candidate ancestry from authoritative main
        if: ${{ github.event_name != 'pull_request' }}
        env:
          CANDIDATE_REF: ${{ github.event.inputs.candidate_ref || '' }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PHASE3_ENABLED: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.phase3_identity_staging == 'on') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/phase3-unified-identity' && github.repository == 'Lengrowth/crm') }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" == "Lengrowth/crm" ]] || { echo "Candidate validation is restricted to the canonical repository" >&2; exit 1; }
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          count_open_prs() {
            CANDIDATE_SHA="$1" EXPECTED_HEAD_REF="${2:-}" python3 - <<'PY'
          import json
          import os
          import urllib.request

          candidate_sha = os.environ["CANDIDATE_SHA"]
          expected_head_ref = os.environ["EXPECTED_HEAD_REF"]
          repository = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/commits/{candidate_sha}/pulls",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              pulls = json.load(response)
          matches = [
              pull for pull in pulls
              if pull.get("state") == "open"
              and pull.get("base", {}).get("ref") == "main"
              and pull.get("head", {}).get("sha") == candidate_sha
              and pull.get("head", {}).get("ref") == (expected_head_ref or pull.get("head", {}).get("ref"))
              and pull.get("head", {}).get("repo", {}).get("full_name") == repository
          ]
          print(len(matches))
          PY
          }
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$PHASE3_ENABLED" == "true" ]]; then
              [[ "$CANDIDATE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "workflow_dispatch Phase 03 requires an exact 40-character commit ref" >&2; exit 1; }
            fi
            if [[ -n "$CANDIDATE_REF" ]]; then
              [[ "$CANDIDATE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "Manually supplied candidate_ref must be an exact 40-character commit" >&2; exit 1; }
              test "$CANDIDATE_SHA" = "$CANDIDATE_REF"
              git merge-base --is-ancestor refs/remotes/origin/main "$CANDIDATE_SHA" || {
                echo "Manually supplied staging candidate does not descend from authoritative main" >&2
                exit 1
              }
              pr_count="$(count_open_prs "$CANDIDATE_SHA")"
              test "$pr_count" = "1" || { echo "Candidate is not the exact head of one open same-repository PR to main" >&2; exit 1; }
            else
              git merge-base --is-ancestor "$CANDIDATE_SHA" refs/remotes/origin/main || {
                echo "Default dispatch candidate is not an ancestor of authoritative main" >&2
                exit 1
              }
            fi
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "codex/phase3-unified-identity" ]]; then
            [[ "$CANDIDATE_SHA" == "$GITHUB_SHA" ]] || { echo "Feature-branch candidate is not the exact pushed commit" >&2; exit 1; }
            git merge-base --is-ancestor refs/remotes/origin/main "$CANDIDATE_SHA" || {
              echo "Phase 03 candidate does not descend from authoritative main" >&2
              exit 1
            }
            pr_count="$(count_open_prs "$CANDIDATE_SHA" "codex/phase3-unified-identity")"
            test "$pr_count" = "1" || { echo "Feature-branch candidate is not the exact head of one open same-repository PR to main" >&2; exit 1; }
          else
            git merge-base --is-ancestor "$CANDIDATE_SHA" refs/remotes/origin/main || {
              echo "Candidate is not an ancestor of authoritative main" >&2
              exit 1
            }
          fi

      - name: Verify the commit-pinned LenERP Core staging bundle
        run: |
          core_commit="$(tr -d '\r\n' < ops/staging/lenerp_core/SOURCE_COMMIT.txt)"
          test "$core_commit" = "6629ea60bd4093907a89bae8f3712ceb5c6a1cd6"
          archive="ops/staging/lenerp_core-${core_commit}.tar"
          test -f "$archive"
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          staging = Path("ops/staging")
          expected, filename = staging.joinpath("lenerp_core.archive.sha256").read_text(encoding="utf-8").split()
          archive = staging / filename
          actual = sha256(archive.read_bytes()).hexdigest().upper()
          if actual != expected.upper():
              raise SystemExit(f"Archive checksum mismatch: expected {expected}, got {actual}")
          print(f"Verified {filename}: {actual}")
          PY
          exact_dir="$RUNNER_TEMP/lenerp_core-exact"
          rm -rf -- "$exact_dir"
          mkdir -p "$exact_dir"
          tar -xf "$archive" -C "$exact_dir"
          test -f "$exact_dir/lenerp_core/demo_seed.py"
          python3 -m compileall -q "$exact_dir/lenerp_core"
          EXACT_DIR="$exact_dir" python3 - <<'PY'
          import re
          import os
          from pathlib import Path
          text = (Path(os.environ['EXACT_DIR']) / 'pyproject.toml').read_text(encoding='utf-8')
          match = re.search(r'^version\s*=\s*["\']([^"\']+)', text, flags=re.MULTILINE)
          version = match.group(1) if match else None
          if version != '0.3.0':
              raise SystemExit(f'Unexpected bundled lenerp_core version: {version}')
          print(f'Bundled lenerp_core {version} validated')
          PY

      - name: Make release scripts executable
        run: chmod +x scripts/release/*.sh scripts/deploy/*.sh

      - name: Use the supported Node.js runtime for the locked frontend toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Reclaim only the disposable npm cache on the staging runner
        run: npm cache clean --force

      - name: Reclaim stale runner action diagnostics before candidate build
        run: |
          set -euo pipefail
          sudo find /home/ubuntu/actions-runner/_diag -type f -name '*.log' -delete
          df -h / /home /opt

      - name: Reclaim disposable npm and Next.js temp directories
        run: |
          sudo find /tmp -maxdepth 1 -mindepth 1 \( -name 'npm-*' -o -name 'next-*' \) -exec rm -rf -- {} +
          df -h / /home /opt

      - name: Reclaim only the older staging rollback release
        run: |
          release_root=/opt/saas-control-staging/releases
          current="$(readlink -f /opt/saas-control-staging/current 2>/dev/null || true)"
          previous="$(readlink -f /opt/saas-control-staging/previous 2>/dev/null || true)"
          if [[ -n "$previous" && "$previous" != "$current" && "$previous" == "$release_root/"* && -d "$previous" ]]; then
            sudo rm -rf -- "$previous"
            sudo rm -f -- /opt/saas-control-staging/previous
          fi
          df -h / /home /opt

      - name: Scan tracked and untracked candidate inputs for credential patterns
        run: python3 scripts/release/secret_scan.py

      - name: Remove only prior generated workspace outputs
        run: rm -rf -- "$GITHUB_WORKSPACE/frontend/node_modules" "$GITHUB_WORKSPACE/frontend/.next" "$GITHUB_WORKSPACE/staging-browser-evidence"

      - name: Retain only active and previous staging candidates
        run: |
          chmod +x scripts/release/prune_staging_releases.sh
          sudo scripts/release/prune_staging_releases.sh

      - name: Run candidate-bound validation suite
        env:
          SOURCE_REPO: ${{ github.workspace }}
          BACKEND_PYTHON: /opt/saas-control-staging/shared/backend-venv/bin/python
        run: |
          /opt/saas-control-staging/shared/backend-venv/bin/pip install --disable-pip-version-check --no-input 'pytest>=8,<9'
          ./scripts/release/validate_candidate.sh

      - name: Set staging-only shell flag for this candidate
        env:
          PHASE1_SHELL_STATE: ${{ inputs.phase1_shell_state || 'off' }}
        run: |
          case "$PHASE1_SHELL_STATE" in on|off) ;; *) echo "Invalid shell state" >&2; exit 1 ;; esac
          sudo python3 - /opt/saas-control-staging/shared/env/staging-backend.env "$PHASE1_SHELL_STATE" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          state = sys.argv[2]
          lines = path.read_text(encoding="utf-8").splitlines()
          output = []
          updated = False
          for line in lines:
              if line.startswith("FEATURE_FLAGS="):
                  entries = [entry for entry in line.removeprefix("FEATURE_FLAGS=").split(",") if entry and not entry.startswith("platform_phase1_shell=")]
                  entries.append(f"platform_phase1_shell={state}")
                  line = "FEATURE_FLAGS=" + ",".join(entries)
                  updated = True
              output.append(line)
          if not updated:
              output.append(f"FEATURE_FLAGS=platform_phase1_shell={state}")
          path.write_text("\n".join(output) + "\n", encoding="utf-8")
          PY

      - name: Set staging-only Phase 3 operator rollout flags
        env:
          ROLLOUT_STAGE: ${{ inputs.rollout_stage || 'operator-validation' }}
        run: |
          sudo python3 - /opt/saas-control-staging/shared/env/staging-backend.env "$ROLLOUT_STAGE" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          stage = sys.argv[2]
          if stage == 'general':
              values = ('on', 'off', 'on')
          else:
              values = ('on', 'on', 'off')
          lines = path.read_text(encoding='utf-8').splitlines()
          output = []
          updated = False
          for line in lines:
              if line.startswith('FEATURE_FLAGS='):
                  entries = [entry for entry in line.removeprefix('FEATURE_FLAGS=').split(',') if entry and not entry.split('=', 1)[0].strip().startswith('module_entitlement_')]
                  entries.extend([f'module_entitlement_writes={values[0]}', f'module_entitlement_operator_only={values[1]}', f'module_entitlement_general={values[2]}'])
                  line = 'FEATURE_FLAGS=' + ','.join(entries)
                  updated = True
              output.append(line)
          if not updated:
              output.append('FEATURE_FLAGS=' + ','.join([f'module_entitlement_writes={values[0]}', f'module_entitlement_operator_only={values[1]}', f'module_entitlement_general={values[2]}']))
          path.write_text('\n'.join(output) + '\n', encoding='utf-8')

      - name: Set staging-only Phase 4 synthetic rollout flags
        env:
          PHASE4_SYNTHETIC_STATE: ${{ inputs.phase4_synthetic_state || 'off' }}
        run: |
          case "$PHASE4_SYNTHETIC_STATE" in on|off) ;; *) echo "Invalid Phase 4 synthetic state" >&2; exit 1 ;; esac
          sudo python3 - /opt/saas-control-staging/shared/env/staging-backend.env "$PHASE4_SYNTHETIC_STATE" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          state = sys.argv[2]
          names = ('onboarding_public_intake', 'onboarding_operator_view', 'onboarding_conversion', 'onboarding_execution', 'onboarding_synthetic_allowlist')
          lines = path.read_text(encoding='utf-8').splitlines()
          output = []
          updated = False
          for line in lines:
              if line.startswith('FEATURE_FLAGS='):
                  entries = [entry for entry in line.removeprefix('FEATURE_FLAGS=').split(',') if entry and entry.split('=', 1)[0].strip() not in names and entry.split('=', 1)[0].strip() != 'onboarding_real_execution']
                  entries.extend([f'{name}={state}' for name in names])
                  entries.append('onboarding_real_execution=off')
                  line = 'FEATURE_FLAGS=' + ','.join(entries)
                  updated = True
              output.append(line)
          if not updated:
              output.append('FEATURE_FLAGS=' + ','.join([f'{name}={state}' for name in names] + ['onboarding_real_execution=off']))
          path.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY

      - name: Configure the dedicated staging Frappe bench adapter
        env:
          STAGING_MARIADB_ROOT_USERNAME: ${{ secrets.STAGING_MARIADB_ROOT_USERNAME }}
          STAGING_MARIADB_ROOT_PASSWORD: ${{ secrets.STAGING_MARIADB_ROOT_PASSWORD }}
        run: |
          db_root_username="saas_phase4_bench"
          db_root_password="$(openssl rand -hex 32)"
          mariadb_socket_admin="false"
          if [[ -n "${STAGING_MARIADB_ROOT_PASSWORD:-}" ]]; then
            mariadb_root_username="${STAGING_MARIADB_ROOT_USERNAME:-root}"
            mariadb_root_password="$STAGING_MARIADB_ROOT_PASSWORD"
          else
            if mariadb_root_credential="$(sudo python3 - <<'PY'
          from configparser import ConfigParser, Error as ConfigParserError
          import json
          from pathlib import Path

          candidates = [
              Path('/root/.my.cnf'),
              Path('/home/frappe/.my.cnf'),
              Path('/home/ubuntu/.my.cnf'),
              Path('/etc/mysql/my.cnf'),
              Path('/etc/mysql/mariadb.cnf'),
              Path('/etc/mysql/debian.cnf'),
              Path('/opt/frappe-staging-bench/sites/common_site_config.json'),
              Path('/opt/frappe-staging-bench/config/common_site_config.json'),
              Path('/opt/frappe-staging-bench/sites/erp-staging.example.test/site_config.json'),
          ]
          candidates.extend(Path('/opt/frappe-staging-bench').glob('**/*.cnf'))
          candidates.extend(Path('/opt/frappe-staging-bench/sites').glob('**/*.json'))
          for path in candidates:
              if not path.is_file():
                  continue
              try:
                  if path.suffix == '.cnf':
                      parser = ConfigParser()
                      parser.read(path)
                      for section in ('client', 'mysql', 'mariadb'):
                          if parser.has_option(section, 'password'):
                              username = parser.get(section, 'user', fallback='root')
                              print(f"{username}\t{parser.get(section, 'password')}")
                              raise SystemExit(0)
                  else:
                      payload = json.loads(path.read_text(encoding='utf-8'))
                      for key in ('root_password', 'db_root_password', 'mariadb_root_password'):
                          value = payload.get(key) if isinstance(payload, dict) else None
                          if value:
                              username = payload.get('root_username', 'root') if isinstance(payload, dict) else 'root'
                              print(f"{username}\t{value}")
                              raise SystemExit(0)
              except (OSError, ValueError, ConfigParserError, json.JSONDecodeError):
                  continue
          raise SystemExit('No protected staging MariaDB root credential was found.')
          PY
            )"; then
              IFS=$'\t' read -r mariadb_root_username mariadb_root_password <<< "$mariadb_root_credential"
            elif sudo -n -u mysql mariadb --protocol=socket --batch --skip-column-names -e 'SELECT 1' >/dev/null 2>&1; then
              mariadb_socket_admin="true"
            else
              echo "No protected staging MariaDB root credential or Unix-socket admin was available." >&2
              exit 1
            fi
          fi
          if [[ "$mariadb_socket_admin" == "true" ]]; then
            run_mariadb_admin() { sudo -n -u mysql mariadb --protocol=socket --batch; }
          else
            [[ -n "$mariadb_root_username" && -n "$mariadb_root_password" ]] || { echo "Staging MariaDB root credential is unavailable" >&2; exit 1; }
            run_mariadb_admin() { sudo -n env MYSQL_PWD="$mariadb_root_password" mariadb --protocol=socket --user="$mariadb_root_username" --batch; }
          fi
          run_mariadb_admin <<SQL
          CREATE USER IF NOT EXISTS '${db_root_username}'@'localhost' IDENTIFIED BY '${db_root_password}';
          CREATE USER IF NOT EXISTS '${db_root_username}'@'%' IDENTIFIED BY '${db_root_password}';
          ALTER USER '${db_root_username}'@'localhost' IDENTIFIED BY '${db_root_password}';
          ALTER USER '${db_root_username}'@'%' IDENTIFIED BY '${db_root_password}';
          GRANT ALL PRIVILEGES ON *.* TO '${db_root_username}'@'localhost' WITH GRANT OPTION;
          GRANT ALL PRIVILEGES ON *.* TO '${db_root_username}'@'%' WITH GRANT OPTION;
          FLUSH PRIVILEGES;
          SQL
          sudo python3 - /opt/saas-control-staging/shared/env/staging-backend.env <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          required = {
              'ERPNEXT_MODE': 'bench',
              'ERPNEXT_BENCH_ROOT': '/opt/frappe-staging-bench',
              'ERPNEXT_BENCH_SITE_PREFIX': 'phase4-',
              'ERPNEXT_BENCH_RUN_AS_USER': 'frappe',
              'ERPNEXT_BENCH_COMMAND': '/usr/local/bin/bench',
              'ERPNEXT_BENCH_WEB_URL': 'http://127.0.0.1:28000',
          }
          lines = path.read_text(encoding='utf-8').splitlines()
          output = []
          seen = set()
          for line in lines:
              key, separator, _ = line.partition('=')
              if separator and key in required:
                  output.append(f'{key}={required[key]}')
                  seen.add(key)
              else:
                  output.append(line)
          output.extend(f'{key}={value}' for key, value in required.items() if key not in seen)
          path.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY
          sudo install -d -o root -g saas-staging -m 0750 /run/saas-control-staging
          sudo tee /run/saas-control-staging/frappe-bench.env >/dev/null <<EOF
          ERPNEXT_DB_ROOT_USERNAME=$db_root_username
          ERPNEXT_DB_ROOT_PASSWORD=$db_root_password
          EOF
          sudo chown root:saas-staging /run/saas-control-staging/frappe-bench.env
          sudo chmod 0640 /run/saas-control-staging/frappe-bench.env
          sudo install -m 0644 ops/staging/saas-control-staging-backend.service /etc/systemd/system/saas-control-staging-backend.service
          sudo install -m 0440 /dev/stdin /etc/sudoers.d/saas-staging-frappe-bench <<'EOF'
          saas-staging ALL=(frappe) NOPASSWD: /usr/local/bin/bench
          EOF
          sudo visudo -cf /etc/sudoers.d/saas-staging-frappe-bench
          sudo systemctl daemon-reload
          sudo systemctl restart saas-control-staging-backend
          sudo systemctl restart saas-control-staging-worker
          sudo -n -u frappe /usr/local/bin/bench --version

      - name: Capture candidate-bound staging ERP backup
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid candidate identity" >&2; exit 1; }
          backup_dir="/opt/saas-control-staging/shared/backups/phase2-${CANDIDATE_SHA}-${GITHUB_RUN_ID}"
          sudo install -d -o frappe -g frappe -m 0750 "$backup_dir"
          sudo -u frappe bash -lc "cd /opt/frappe-staging-bench && bench --site erp-staging.example.test backup --with-files --backup-path '$backup_dir'"
          control_db=/opt/saas-control-staging/shared/data/control-plane-staging.db
          if [[ -f "$control_db" ]]; then
            sudo install -o frappe -g frappe -m 0640 "$control_db" "$backup_dir/control-plane-staging.db"
          fi
          backup_files="$(sudo find "$backup_dir" -maxdepth 1 -type f ! -name SHA256SUMS -print -quit)"
          [[ -n "$backup_files" ]] || { echo "staging backup produced no files" >&2; exit 1; }
          sudo find "$backup_dir" -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sudo xargs -0 sha256sum | sudo tee "$backup_dir/SHA256SUMS" >/dev/null
          sudo test -s "$backup_dir/SHA256SUMS"
          echo "PHASE02_STAGING_BACKUP_DIR=$backup_dir" >> "$GITHUB_ENV"
          echo "Candidate-bound staging backup captured: $backup_dir"

      - name: Reuse the already-forward staging schema for bootstrap validation
        if: ${{ (github.event_name == 'pull_request' && github.head_ref == 'codex/phase3-workflow-bootstrap') || (github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/phase3-workflow-bootstrap') }}
        run: |
          # Earlier isolated Phase 03 rehearsals advanced only the disposable
          # staging schema. The bootstrap contains no application migrations,
          # so do not ask its older Alembic graph to downgrade or reinterpret
          # that schema. The final Phase 03 candidate runs migrations normally.
          echo "RUN_DB_MIGRATION=false" >> "$GITHUB_ENV"

      - name: Build and deploy exact candidate to staging
        env:
          DEPLOY_TARGET: staging
          TARGET_REF: ${{ steps.candidate.outputs.sha }}
          RELEASE_ID: ${{ steps.candidate.outputs.sha }}
          CUSTOM_APP_VERSION: "0.3.0"
          REQUIRE_AUTH_SMOKE: "true"
        run: |
          core_commit="$(tr -d '\r\n' < ops/staging/lenerp_core/SOURCE_COMMIT.txt)"
          CUSTOM_APP_COMMIT="$core_commit" ./scripts/deploy/deploy_saas_control.sh

      - name: Install and migrate the pinned HRMS dependency
        run: |
          hrms_commit="e68a3deaa95ae5b2c3d743297d0a4ab505733fc1"
          hrms_dir=/opt/frappe-staging-bench/apps/hrms
          apps="$(sudo -u frappe bash -lc "cd /opt/frappe-staging-bench && bench --site erp-staging.example.test list-apps")"
          if [[ ! -d "$hrms_dir/.git" ]]; then
            sudo -u frappe bash -lc "cd /opt/frappe-staging-bench && bench get-app --branch v15.64.1 https://github.com/frappe/hrms"
          fi
          grep -Eq '^frappe[[:space:]]+15\.119\.1([[:space:]]|$)' <<<"$apps"
          grep -Eq '^erpnext[[:space:]]+15\.120\.0([[:space:]]|$)' <<<"$apps"
          test -d "$hrms_dir/.git"
          test "$(sudo -u frappe git -C "$hrms_dir" rev-parse HEAD)" = "$hrms_commit"
          test "$(sudo -u frappe git -C /opt/frappe-staging-bench/apps/frappe rev-parse HEAD)" = "edae775dd36b6c4ad7acab10230262bd74040765"
          test "$(sudo -u frappe git -C /opt/frappe-staging-bench/apps/erpnext rev-parse HEAD)" = "945e825bee3d0d645f6cb59bcaab90fcbfb98ce3"
          sudo -u frappe bash -lc "cd /opt/frappe-staging-bench && bench setup requirements hrms"
          if ! grep -Eq '^hrms[[:space:]]+15\.64\.1([[:space:]]|$)' <<<"$apps"; then
            sudo -u frappe bash -lc "cd /opt/frappe-staging-bench && bench --site erp-staging.example.test install-app hrms"
          fi
          sudo -u frappe bash -lc "cd /opt/frappe-staging-bench && bench --site erp-staging.example.test migrate"
          sudo -u frappe bash -lc "cd /opt/frappe-staging-bench && bench build --app hrms"

      - name: Install and migrate the exact custom app from the pinned staging bundle
        run: |
          core_commit="$(tr -d '\r\n' < ops/staging/lenerp_core/SOURCE_COMMIT.txt)"
          exact_dir="$RUNNER_TEMP/lenerp_core-exact"
          test -d "$exact_dir"
          test "$core_commit" = "6629ea60bd4093907a89bae8f3712ceb5c6a1cd6"
          sudo rsync -a --delete --exclude='.git' "$exact_dir/" /opt/frappe-staging-bench/apps/lenerp_core/
          printf '%s\n' "$core_commit" | sudo tee /opt/frappe-staging-bench/apps/lenerp_core/SOURCE_COMMIT.txt >/dev/null
          sudo chown -R frappe:frappe /opt/frappe-staging-bench/apps/lenerp_core
          # The exact bundle is copied into the protected bench rather than
          # fetched with bench get-app. Register it explicitly before asking
          # Frappe to install it; otherwise a clean/recovered bench can have
          # the source tree present while apps.txt still omits the app.
          apps_file=/opt/frappe-staging-bench/sites/apps.txt
          sudo -u frappe python3 - "$apps_file" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          lines = [line.strip() for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
          if 'lenerp_core' not in lines:
              path.write_text('\n'.join([*lines, 'lenerp_core']) + '\n', encoding='utf-8')
          PY
          sudo -u frappe grep -qx 'lenerp_core' "$apps_file"
          test "$(sudo -u frappe tr -d '\r\n' < /opt/frappe-staging-bench/apps/lenerp_core/SOURCE_COMMIT.txt)" = "$core_commit"
          if ! sudo -u frappe bash -lc "cd /opt/frappe-staging-bench && bench --site erp-staging.example.test list-apps | grep -Eq '^lenerp_core[[:space:]]'"; then
            sudo -u frappe bash -lc "cd /opt/frappe-staging-bench && bench --site erp-staging.example.test install-app lenerp_core"
          fi
          sudo -u frappe bash -lc "cd /opt/frappe-staging-bench && bench --site erp-staging.example.test migrate"
          sudo -u frappe bash -lc "cd /opt/frappe-staging-bench && bench build --app lenerp_core"
          sudo systemctl restart frappe-staging-web.service frappe-staging-worker-short.service frappe-staging-schedule.service

      - name: Set staging-only Champion Phase 04 workspace flag
        env:
          PHASE4_CHAMPION_STATE: ${{ inputs.phase4_champion_workspace_state || (github.event_name == 'pull_request' && 'on') || 'off' }}
        run: |
          case "$PHASE4_CHAMPION_STATE" in on|off) ;; *) echo "Invalid Champion Phase 04 workspace state" >&2; exit 1 ;; esac
          sudo -u frappe bash -lc "cd /opt/frappe-staging-bench && bench --site erp-staging.example.test set-config lenerp_phase4_workspace_enabled '$PHASE4_CHAMPION_STATE'"
          if [[ "$PHASE4_CHAMPION_STATE" == "on" ]]; then
            sudo -u frappe bash -lc "cd /opt/frappe-staging-bench && bench --site erp-staging.example.test set-config lenerp_phase4_role_rollout '{\"Champion Administrator\":true,\"Champion Dispatcher\":true,\"Champion Sales User\":true,\"Champion Accounting User\":true,\"Champion Inventory Manager\":true,\"Champion Field Technician\":true,\"Champion HR Payroll User\":true,\"Champion Quality Support User\":true,\"Champion Read Only User\":true}'"
          else
            sudo -u frappe bash -lc "cd /opt/frappe-staging-bench && bench --site erp-staging.example.test set-config lenerp_phase4_role_rollout '{}'"
          fi
          sudo -u frappe bash -lc "cd /opt/frappe-staging-bench && bench --site erp-staging.example.test clear-cache"

      - name: Verify the dedicated ERP staging bench and queues
        env:
          OUTPUT_FILE: ${{ github.workspace }}/staging-browser-evidence/erp/phase02-runtime-readback.json
          EXPECTED_CUSTOM_APP_COMMIT: 6629ea60bd4093907a89bae8f3712ceb5c6a1cd6
        run: sudo env OUTPUT_FILE="$OUTPUT_FILE" BACKUP_DIR="${PHASE02_STAGING_BACKUP_DIR:-}" EXPECTED_CUSTOM_APP_COMMIT="$EXPECTED_CUSTOM_APP_COMMIT" scripts/release/erp_staging_smoke.sh

      - name: Run the persisted Champion synthetic ERP demonstration smoke
        env:
          KEEP_DEMO: "1"
          EXPECTED_CUSTOM_APP_VERSION: "0.3.0"
        run: sudo scripts/release/erp_demo_smoke.sh

      - name: Create real ERP role principals and verify permissions
        env:
          RUN_ID: ${{ github.run_id }}
          ROLE_PASSWORD_FILE: /run/saas-control-staging/erp-role-password-${{ github.run_id }}
          ROLE_EMAIL_PREFIX: champion-demo-role-${{ github.run_id }}
          OUTPUT_FILE: ${{ github.workspace }}/staging-browser-evidence/erp-role-permission-evidence.json
        run: |
          sudo env RUN_ID="$RUN_ID" ROLE_PASSWORD_FILE="$ROLE_PASSWORD_FILE" ROLE_EMAIL_PREFIX="$ROLE_EMAIL_PREFIX" OUTPUT_FILE="$OUTPUT_FILE" scripts/release/erp_role_smoke.sh
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/staging-browser-evidence"
          sudo install -m 600 -o "$(id -u)" -g "$(id -g)" "$ROLE_PASSWORD_FILE" "$RUNNER_TEMP/erp-role-password-${{ github.run_id }}"

      - name: Run isolated synthetic Phase 4 onboarding smoke
        if: ${{ (inputs.phase4_synthetic_state || 'off') == 'on' }}
        env:
          RUN_ID: phase4-${{ github.run_id }}
        run: |
          token_file=/run/saas-control-staging/smoke/auth-token
          evidence_file="/tmp/phase4-synthetic-evidence-${RUN_ID}.json"
          trap 'sudo rm -f -- "$evidence_file"' EXIT
          set +e
          sudo -n -u saas-staging env RUN_ID="$RUN_ID" TOKEN_FILE="$token_file" EVIDENCE_FILE="$evidence_file" bash -c '
            set -a
            . /opt/saas-control-staging/shared/env/staging-backend.env
            . /run/saas-control-staging/frappe-bench.env
            set +a
            PYTHONPATH=/opt/saas-control-staging/current/backend \
              /opt/saas-control-staging/shared/backend-venv/bin/python \
              /opt/saas-control-staging/current/scripts/release/phase4_synthetic_smoke.py \
              --base-url http://127.0.0.1:18001 \
              --admin-token-file "$TOKEN_FILE" \
              --run-id "$RUN_ID" \
              --output "$EVIDENCE_FILE"
          '
          smoke_status=$?
          set -e
          if [[ -f "$evidence_file" ]]; then
            sudo install -m 644 -o "$(id -u)" -g "$(id -g)" "$evidence_file" "$GITHUB_WORKSPACE/phase4-synthetic-evidence.json"
          else
            echo "Phase 4 smoke did not produce an evidence file" >&2
          fi
          if [[ "$smoke_status" -ne 0 ]]; then exit "$smoke_status"; fi

      - name: Run controlled Phase 4 failure and recovery smoke
        if: ${{ (inputs.phase4_synthetic_state || 'off') == 'on' }}
        env:
          RUN_ID: phase4-recovery-${{ github.run_id }}
        run: |
          token_file=/run/saas-control-staging/smoke/auth-token
          evidence_file="/tmp/phase4-synthetic-recovery-evidence-${RUN_ID}.json"
          trap 'sudo rm -f -- "$evidence_file"' EXIT
          set +e
          sudo -n -u saas-staging env RUN_ID="$RUN_ID" TOKEN_FILE="$token_file" EVIDENCE_FILE="$evidence_file" bash -c '
            set -a
            . /opt/saas-control-staging/shared/env/staging-backend.env
            . /run/saas-control-staging/frappe-bench.env
            set +a
            PYTHONPATH=/opt/saas-control-staging/current/backend \
              /opt/saas-control-staging/shared/backend-venv/bin/python \
              /opt/saas-control-staging/current/scripts/release/phase4_synthetic_smoke.py \
              --base-url http://127.0.0.1:18001 \
              --admin-token-file "$TOKEN_FILE" \
              --run-id "$RUN_ID" \
              --failure-step health_checks \
              --output "$EVIDENCE_FILE"
          '
          smoke_status=$?
          set -e
          if [[ -f "$evidence_file" ]]; then
            sudo install -m 644 -o "$(id -u)" -g "$(id -g)" "$evidence_file" "$GITHUB_WORKSPACE/phase4-synthetic-recovery-evidence.json"
          else
            echo "Phase 4 recovery smoke did not produce an evidence file" >&2
          fi
          if [[ "$smoke_status" -ne 0 ]]; then exit "$smoke_status"; fi

      - name: Bind Phase 4 evidence to the exact candidate and staging run
        if: ${{ always() && (inputs.phase4_synthetic_state || 'off') == 'on' }}
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          python3 - "$GITHUB_WORKSPACE/phase4-synthetic-evidence-metadata.json" <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone

          candidate_sha = os.environ["CANDIDATE_SHA"]
          if len(candidate_sha) != 40 or any(char not in "0123456789abcdef" for char in candidate_sha):
              raise SystemExit("candidate SHA is not a full lowercase commit SHA")
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "evidence_version": 2,
                      "candidate_sha": candidate_sha,
                      "staging_run_id": int(os.environ["GITHUB_RUN_ID"]),
                      "workflow_file": ".github/workflows/deploy-saas-control.yml",
                      "success_evidence_file": "phase4-synthetic-evidence.json",
                      "recovery_evidence_file": "phase4-synthetic-recovery-evidence.json",
                      "bound_at_utc": datetime.now(timezone.utc).isoformat(),
                  },
                  handle,
                  indent=2,
                  sort_keys=True,
              )
          with open(sys.argv[1], encoding="utf-8") as handle:
              json.load(handle)
          PY

      - name: Upload non-secret Phase 4 synthetic evidence
        if: ${{ always() && (inputs.phase4_synthetic_state || 'off') == 'on' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase4-synthetic-evidence-${{ github.run_id }}
          path: |
            phase4-synthetic-evidence.json
            phase4-synthetic-recovery-evidence.json
            phase4-synthetic-evidence-metadata.json
          if-no-files-found: error
          retention-days: 30

      - name: Install browser runtime for durable staging evidence
        run: /opt/saas-control-staging/current/frontend/node_modules/.bin/playwright install --with-deps chromium

      - name: Prepare disposable non-admin route test identity
        env:
          NON_ADMIN_SMOKE_EMAIL: phase1-non-admin-${{ github.run_id }}@example.test
        run: |
          sudo install -d -o saas-staging -g saas-staging -m 700 /run/saas-control-staging/smoke
          sudo chown saas-staging:saas-staging /run/saas-control-staging/smoke
          sudo chmod 700 /run/saas-control-staging/smoke
          set -a
          . /opt/saas-control-staging/shared/env/staging-backend.env
          set +a
          auth_script="/opt/saas-control-staging/current/scripts/release/prepare_staging_smoke_auth.py"
          token_tmp="/tmp/saas-control-staging-non-admin-${GITHUB_RUN_ID}.token"
          sudo -n -E -u saas-staging env \
            PYTHONPATH=/opt/saas-control-staging/current/backend \
            STAGING_SMOKE_EMAIL="$NON_ADMIN_SMOKE_EMAIL" \
            /opt/saas-control-staging/shared/backend-venv/bin/python \
            "$auth_script" \
            --token-file "$token_tmp" \
            --non-admin
          sudo install -m 600 -o saas-staging -g saas-staging "$token_tmp" /run/saas-control-staging/smoke/non-admin-auth-token
          sudo rm -f -- "$token_tmp"

      - name: Remove stale exact Phase 2 browser records before empty-state capture
        run: |
          mkdir -p "$GITHUB_WORKSPACE/staging-browser-evidence"
          cleanup_tmp="/tmp/saas-control-phase2-pre-browser-cleanup-${GITHUB_RUN_ID}.json"
          set -a
          . /opt/saas-control-staging/shared/env/staging-backend.env
          set +a
          sudo -n -E -u saas-staging env PYTHONPATH=/opt/saas-control-staging/current/backend \
            /opt/saas-control-staging/shared/backend-venv/bin/python \
            /opt/saas-control-staging/current/scripts/release/cleanup_phase2_synthetic.py \
            --discover-stale --output "$cleanup_tmp"
          sudo install -m 644 -o "$(id -u)" -g "$(id -g)" "$cleanup_tmp" \
            "$GITHUB_WORKSPACE/staging-browser-evidence/pre-browser-phase2-cleanup.json"
          sudo rm -f -- "$cleanup_tmp"

      - name: Capture candidate-bound browser and accessibility evidence
        # Keep this capture step adjacent to the deployed release dependencies.
        env:
          EXPECTED_PHASE_ONE_SHELL: ${{ inputs.phase1_shell_state || 'off' }}
          EXPECTED_RELEASE: ${{ steps.candidate.outputs.sha }}
          RUNTIME_RELEASE_URL: http://127.0.0.1:18001/runtime/release
          ROLLOUT_STAGE: ${{ inputs.rollout_stage || 'operator-validation' }}
          RUN_PHASE3_BROWSER_EVIDENCE: "off"
          HEADLESS: "false"
          BASE_URL: http://127.0.0.1:13001
          HOST_HEADER: staging.example.test
          OUTPUT_DIR: ${{ github.workspace }}/staging-browser-evidence
        run: |
          token_file="$RUNNER_TEMP/saas-staging-smoke-token"
          non_admin_token_file="$RUNNER_TEMP/saas-staging-non-admin-token"
          sudo install -m 600 -o "$(id -u)" -g "$(id -g)" /run/saas-control-staging/smoke/auth-token "$token_file"
          sudo install -m 600 -o "$(id -u)" -g "$(id -g)" /run/saas-control-staging/smoke/non-admin-auth-token "$non_admin_token_file"
          browser_path="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*/chrome*/chrome' -print -quit 2>/dev/null || true)"
          [[ -n "$browser_path" ]] || { echo "Installed Chromium executable was not found" >&2; exit 1; }
          evidence_script="/opt/saas-control-staging/current/frontend/scripts/capture_browser_evidence.mjs"
          AUTH_TOKEN_FILE="$token_file" NON_ADMIN_AUTH_TOKEN_FILE="$non_admin_token_file" BROWSER_EXECUTABLE_PATH="$browser_path" node "$evidence_script"
          rm -f -- "$token_file" "$non_admin_token_file"

      - name: Capture authenticated ERP browser, print, export, and responsive evidence
        env:
          ERP_BASE_URL: http://127.0.0.1:28000
          ERP_HOST_HEADER: erp-staging.example.test
          ERP_ROLE_EMAIL_PREFIX: champion-demo-role-${{ github.run_id }}
          ERP_ROLE_PASSWORD_FILE: ${{ runner.temp }}/erp-role-password-${{ github.run_id }}
          OUTPUT_DIR: ${{ github.workspace }}/staging-browser-evidence/erp
          HEADLESS: "true"
          PHASE4_CHAMPION_WORKSPACE_STATE: ${{ inputs.phase4_champion_workspace_state || (github.event_name == 'pull_request' && 'on') || 'off' }}
        run: |
          browser_path="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*/chrome*/chrome' -print -quit 2>/dev/null || true)"
          [[ -n "$browser_path" ]] || { echo "Installed Chromium executable was not found" >&2; exit 1; }
          evidence_script="/opt/saas-control-staging/current/frontend/scripts/capture_erp_browser_evidence.mjs"
          BROWSER_EXECUTABLE_PATH="$browser_path" node "$evidence_script"

      - name: Start isolated Phase 03 TLS callback proxy
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.phase3_identity_staging == 'on') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/phase3-unified-identity' && github.repository == 'Lengrowth/crm') }}
        run: |
          identity_dir="$RUNNER_TEMP/phase3-identity"
          tls_dir="$RUNNER_TEMP/phase3-identity-tls"
          mkdir -p "$identity_dir" "$tls_dir"
          openssl rand -hex 32 > "$identity_dir/exchange-secret"
          chmod 600 "$identity_dir/exchange-secret"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$tls_dir/server.key" -out "$tls_dir/server.crt" \
            -subj "/CN=staging.example.test" \
            -addext "subjectAltName=DNS:staging.example.test,DNS:erp-staging.example.test"
          printf '127.0.0.1 staging.example.test erp-staging.example.test # phase3-identity-%s\n' "$GITHUB_RUN_ID" | sudo tee -a /etc/hosts >/dev/null
          sudo install -d -o root -g frappe -m 0750 /run/saas-control-staging/phase3-identity
          sudo install -o root -g frappe -m 0640 "$tls_dir/server.crt" /run/saas-control-staging/phase3-identity/ca.crt
          nohup python3 scripts/release/phase3_staging_tls_proxy.py \
            --port 18443 --cert "$tls_dir/server.crt" --key "$tls_dir/server.key" \
            > "$tls_dir/proxy.log" 2>&1 &
          echo $! > "$tls_dir/proxy.pid"
          sleep 1
          kill -0 "$(cat "$tls_dir/proxy.pid")"

      - name: Prepare and configure synthetic Phase 03 identity lane
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.phase3_identity_staging == 'on') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/phase3-unified-identity' && github.repository == 'Lengrowth/crm') }}
        run: |
          identity_dir="$RUNNER_TEMP/phase3-identity"
          tls_dir="$RUNNER_TEMP/phase3-identity-tls"
          manifest="$identity_dir/manifest.json"
          control_base="https://staging.example.test:18443"
          erp_base="https://erp-staging.example.test:18443"
          set -a
          . /opt/saas-control-staging/shared/env/staging-backend.env
          set +a
          sudo -n -E env PYTHONPATH=/opt/saas-control-staging/current/backend \
            /opt/saas-control-staging/shared/backend-venv/bin/python \
            scripts/release/phase3_identity_staging.py prepare \
            --run-id "${GITHUB_RUN_ID}" --control-base-url "$control_base" --erp-base-url "$erp_base" \
            --site-name erp-staging.example.test --output-dir "$identity_dir" --manifest "$manifest" \
            --exchange-secret-file "$identity_dir/exchange-secret"
          sudo chown -R "$(id -u):$(id -g)" "$identity_dir"
          tenant_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tenant_id"])' "$manifest")"
          organization_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["organization_id"])' "$manifest")"
          site_config=/opt/frappe-staging-bench/sites/erp-staging.example.test/site_config.json
          sudo cp -- "$site_config" "$identity_dir/site_config.before.json"
          break_glass_user="champion-demo-role-${GITHUB_RUN_ID}-champion-administrator@example.test"
          sudo -n -E env PYTHONPATH=/opt/saas-control-staging/current/backend \
            /opt/saas-control-staging/shared/backend-venv/bin/python \
            scripts/release/phase3_identity_staging.py break-glass-test \
            --erp-base-url "https://erp-staging.example.test:18443" \
            --ca-bundle "$tls_dir/server.crt" --evidence "$GITHUB_WORKSPACE/staging-browser-evidence/phase3-identity-api.json" \
            --user "$break_glass_user" --password-file "$RUNNER_TEMP/erp-role-password-${GITHUB_RUN_ID}" --phase before_enable
          sudo python3 - "$site_config" "$tenant_id" "$organization_id" "$identity_dir/exchange-secret" "$GITHUB_RUN_ID" <<'PY'
          import json
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          payload = json.loads(path.read_text(encoding='utf-8'))
          payload.update({
              'host_name': 'https://erp-staging.example.test:18443',
              'lenerp_sso_enabled': 1,
              'lenerp_sso_jit_enabled': 1,
              'lenerp_control_plane_url': 'https://staging.example.test:18443',
              'lenerp_control_plane_api_url': 'https://staging.example.test:18443',
              'lenerp_control_plane_tenant_id': sys.argv[2],
              'lenerp_control_plane_organization_id': sys.argv[3],
              'lenerp_sso_client_id': 'lenerp-erp',
              'lenerp_sso_audience': 'lenerp-erp',
              'lenerp_sso_exchange_secret': Path(sys.argv[4]).read_text(encoding='utf-8').strip(),
              'lenerp_sso_ca_bundle': '/run/saas-control-staging/phase3-identity/ca.crt',
              'lenerp_sso_role_profiles': '{"champion-v1":["Champion Sales User"]}',
              'lenerp_break_glass_user': f'champion-demo-role-{sys.argv[5]}-champion-administrator@example.test',
          })
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          sudo cp -- /opt/saas-control-staging/shared/env/staging-backend.env "$identity_dir/staging-backend.env.before"
          sudo python3 - /opt/saas-control-staging/shared/env/staging-backend.env "$identity_dir/exchange-secret" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          secret = Path(sys.argv[2]).read_text(encoding='utf-8').strip()
          values = {}
          for line in path.read_text(encoding='utf-8').splitlines():
              key, separator, value = line.partition('=')
              if separator:
                  values[key] = value
          flags = [item for item in values.get('FEATURE_FLAGS', '').split(',') if item and not item.split('=', 1)[0] == 'phase3_unified_identity']
          flags.append('phase3_unified_identity=on')
          values['FEATURE_FLAGS'] = ','.join(flags)
          values['FRONTEND_BASE_URL'] = 'https://staging.example.test:18443'
          values['CORS_ORIGINS'] = 'https://staging.example.test:18443,http://staging.example.test,http://127.0.0.1:13001'
          values['SSO_EXCHANGE_SECRET'] = secret
          path.write_text('\n'.join(f'{key}={value}' for key, value in values.items()) + '\n', encoding='utf-8')
          PY
          sudo -n -u frappe bash -lc 'cd /opt/frappe-staging-bench && /usr/local/bin/bench --site erp-staging.example.test clear-cache'
          sudo systemctl restart frappe-staging-web.service
          sudo systemctl restart saas-control-staging-backend
          sleep 3
          sudo -n -E env PYTHONPATH=/opt/saas-control-staging/current/backend \
            /opt/saas-control-staging/shared/backend-venv/bin/python \
            scripts/release/phase3_identity_staging.py break-glass-test \
            --erp-base-url "https://erp-staging.example.test:18443" \
            --ca-bundle "$tls_dir/server.crt" --evidence "$GITHUB_WORKSPACE/staging-browser-evidence/phase3-identity-api.json" \
            --user "$break_glass_user" --password-file "$RUNNER_TEMP/erp-role-password-${GITHUB_RUN_ID}" --phase sso_enabled

      - name: Capture Phase 03 identity browser and responsive evidence
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.phase3_identity_staging == 'on') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/phase3-unified-identity' && github.repository == 'Lengrowth/crm') }}
        env:
          PHASE3_IDENTITY_MANIFEST: ${{ runner.temp }}/phase3-identity/manifest.json
          OUTPUT_DIR: ${{ github.workspace }}/staging-browser-evidence/phase3-identity
        run: |
          browser_path="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*/chrome*/chrome' -print -quit 2>/dev/null || true)"
          [[ -n "$browser_path" ]] || { echo "Installed Chromium executable was not found" >&2; exit 1; }
          evidence_script="/opt/saas-control-staging/current/frontend/scripts/capture_phase3_identity_evidence.mjs"
          BROWSER_EXECUTABLE_PATH="$browser_path" node "$evidence_script"

      - name: Run Phase 03 identity API contract
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.phase3_identity_staging == 'on') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/phase3-unified-identity' && github.repository == 'Lengrowth/crm') }}
        env:
          PHASE3_MANIFEST: ${{ runner.temp }}/phase3-identity/manifest.json
          PHASE3_CA: ${{ runner.temp }}/phase3-identity-tls/server.crt
          PHASE3_EVIDENCE: ${{ github.workspace }}/staging-browser-evidence/phase3-identity-api.json
        run: |
          set -a
          . /opt/saas-control-staging/shared/env/staging-backend.env
          set +a
          sudo -n -E env PYTHONPATH=/opt/saas-control-staging/current/backend \
            /opt/saas-control-staging/shared/backend-venv/bin/python \
            scripts/release/phase3_identity_staging.py api-tests \
            --manifest "$PHASE3_MANIFEST" --ca-bundle "$PHASE3_CA" --evidence "$PHASE3_EVIDENCE"

      - name: Verify Phase 03 membership removal and mapping revocation
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.phase3_identity_staging == 'on') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/phase3-unified-identity' && github.repository == 'Lengrowth/crm') }}
        env:
          PHASE3_MANIFEST: ${{ runner.temp }}/phase3-identity/manifest.json
          PHASE3_CA: ${{ runner.temp }}/phase3-identity-tls/server.crt
          PHASE3_EVIDENCE: ${{ github.workspace }}/staging-browser-evidence/phase3-identity-api.json
        run: |
          set -a
          . /opt/saas-control-staging/shared/env/staging-backend.env
          set +a
          sudo -n -E env PYTHONPATH=/opt/saas-control-staging/current/backend \
            /opt/saas-control-staging/shared/backend-venv/bin/python \
            scripts/release/phase3_identity_staging.py post-tests \
            --manifest "$PHASE3_MANIFEST" --ca-bundle "$PHASE3_CA" --evidence "$PHASE3_EVIDENCE"

      - name: Roll back Phase 03 identity flag and verify independent login
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.phase3_identity_staging == 'on') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/phase3-unified-identity' && github.repository == 'Lengrowth/crm') }}
        env:
          PHASE3_MANIFEST: ${{ runner.temp }}/phase3-identity/manifest.json
          PHASE3_CA: ${{ runner.temp }}/phase3-identity-tls/server.crt
          PHASE3_EVIDENCE: ${{ github.workspace }}/staging-browser-evidence/phase3-identity-api.json
        run: |
          sudo python3 - /opt/saas-control-staging/shared/env/staging-backend.env <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          lines = path.read_text(encoding='utf-8').splitlines()
          output = []
          for line in lines:
              if line.startswith('FEATURE_FLAGS='):
                  values = [item for item in line.removeprefix('FEATURE_FLAGS=').split(',') if item and not item.split('=', 1)[0] == 'phase3_unified_identity']
                  line = 'FEATURE_FLAGS=' + ','.join(values)
              output.append(line)
          path.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY
          sudo systemctl stop saas-control-staging-backend
          sudo systemctl start saas-control-staging-backend
          sudo systemctl is-active --quiet saas-control-staging-backend
          sleep 5
          set -a
          . /opt/saas-control-staging/shared/env/staging-backend.env
          set +a
          break_glass_user="champion-demo-role-${GITHUB_RUN_ID}-champion-administrator@example.test"
          sudo -n -E env PYTHONPATH=/opt/saas-control-staging/current/backend \
            /opt/saas-control-staging/shared/backend-venv/bin/python \
            scripts/release/phase3_identity_staging.py break-glass-test \
            --erp-base-url "https://erp-staging.example.test:18443" \
            --ca-bundle "$PHASE3_CA" --evidence "$PHASE3_EVIDENCE" \
            --user "$break_glass_user" --password-file "$RUNNER_TEMP/erp-role-password-${GITHUB_RUN_ID}" --phase after_rollback
          sudo -n -E env PYTHONPATH=/opt/saas-control-staging/current/backend \
            /opt/saas-control-staging/shared/backend-venv/bin/python \
            scripts/release/phase3_identity_staging.py rollback-test \
            --manifest "$PHASE3_MANIFEST" --ca-bundle "$PHASE3_CA" --evidence "$PHASE3_EVIDENCE"

      - name: Restore Phase 03 staging configuration and stop TLS proxy
        if: ${{ always() && ((github.event_name == 'workflow_dispatch' && github.event.inputs.phase3_identity_staging == 'on') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/phase3-unified-identity' && github.repository == 'Lengrowth/crm')) }}
        run: |
          identity_dir="$RUNNER_TEMP/phase3-identity"
          tls_dir="$RUNNER_TEMP/phase3-identity-tls"
          if [[ -f "$identity_dir/staging-backend.env.before" ]]; then
            sudo cp -- "$identity_dir/staging-backend.env.before" /opt/saas-control-staging/shared/env/staging-backend.env
          fi
          if [[ -f "$identity_dir/site_config.before.json" ]]; then
            sudo cp -- "$identity_dir/site_config.before.json" /opt/frappe-staging-bench/sites/erp-staging.example.test/site_config.json
          fi
          sudo -n -u frappe bash -lc 'cd /opt/frappe-staging-bench && /usr/local/bin/bench --site erp-staging.example.test clear-cache' || true
          sudo systemctl restart frappe-staging-web.service || true
          sudo systemctl restart saas-control-staging-backend || true
          sudo sed -i "/# phase3-identity-${GITHUB_RUN_ID}$/d" /etc/hosts || true
          if [[ -f "$identity_dir/manifest.json" ]]; then
            set -a
            . /opt/saas-control-staging/shared/env/staging-backend.env
            set +a
            sudo -n -E env PYTHONPATH=/opt/saas-control-staging/current/backend \
              /opt/saas-control-staging/shared/backend-venv/bin/python \
              scripts/release/phase3_identity_staging.py cleanup \
              --manifest "$identity_dir/manifest.json" || true
          fi
          if [[ -f "$tls_dir/proxy.pid" ]]; then
            kill "$(cat "$tls_dir/proxy.pid")" 2>/dev/null || true
          fi

      - name: Roll back Phase 04 workspace flag and verify legacy workspace
        if: always()
        run: |
          site_config="/opt/frappe-staging-bench/sites/erp-staging.example.test/site_config.json"
          sudo -u frappe bash -lc "cd /opt/frappe-staging-bench && bench --site erp-staging.example.test set-config lenerp_phase4_workspace_enabled 'off'"
          sudo -u frappe bash -lc "cd /opt/frappe-staging-bench && bench --site erp-staging.example.test set-config lenerp_phase4_role_rollout '{}'"
          sudo -u frappe bash -lc 'cd /opt/frappe-staging-bench && bench --site erp-staging.example.test clear-cache'
          legacy_count="$(sudo -u frappe bash -lc "cd /opt/frappe-staging-bench && bench --site erp-staging.example.test execute frappe.client.get_count --kwargs '{\"doctype\":\"Workspace\",\"filters\":{\"name\":\"Champion ERP\"}}'" | tr -d '\r\n ' )"
          sudo python3 - "$site_config" "$legacy_count" "$GITHUB_WORKSPACE/staging-browser-evidence/phase4-rollback-evidence.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          config_path, legacy_count, output_path = sys.argv[1:]
          config = json.loads(Path(config_path).read_text(encoding="utf-8"))
          flag = str(config.get("lenerp_phase4_workspace_enabled", "")).strip().lower()
          rollout = config.get("lenerp_phase4_role_rollout", {})
          if flag not in {"off", "0", "false"}:
              raise SystemExit(f"Phase 04 workspace flag did not roll back: {flag!r}")
          if rollout not in ({}, "{}"):
              raise SystemExit(f"Phase 04 role rollout did not clear: {rollout!r}")
          if legacy_count != "1":
              raise SystemExit(f"legacy Champion ERP Workspace readback was {legacy_count!r}")
          output = {
              "status": "passed",
              "phase4_workspace_enabled": False,
              "phase4_role_rollout": {},
              "legacy_workspace": "Champion ERP",
              "legacy_workspace_count": 1,
          }
          path = Path(output_path)
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(output, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          sudo chown "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/staging-browser-evidence/phase4-rollback-evidence.json"

      - name: Remove synthetic ERP role principals
        if: always()
        env:
          ROLE_PASSWORD_FILE: /run/saas-control-staging/erp-role-password-${{ github.run_id }}
          ROLE_EMAIL_PREFIX: champion-demo-role-${{ github.run_id }}
        run: |
          sudo -u frappe env DEMO_ROLE_PASSWORD_FILE="$ROLE_PASSWORD_FILE" DEMO_ROLE_EMAIL_PREFIX="$ROLE_EMAIL_PREFIX" bash -lc 'cd /opt/frappe-staging-bench && bench --site erp-staging.example.test execute lenerp_core.permission_smoke.cleanup'
          sudo rm -f -- "$ROLE_PASSWORD_FILE"
          rm -f -- "$RUNNER_TEMP/erp-role-password-${{ github.run_id }}"

      - name: Remove disposable non-admin route test identity
        if: always()
        env:
          NON_ADMIN_SMOKE_EMAIL: phase1-non-admin-${{ github.run_id }}@example.test
        run: |
          sudo install -d -o saas-staging -g saas-staging -m 700 /run/saas-control-staging/smoke
          set -a
          . /opt/saas-control-staging/shared/env/staging-backend.env
          set +a
          auth_script="/opt/saas-control-staging/current/scripts/release/prepare_staging_smoke_auth.py"
          cleanup_token_file="/tmp/saas-control-staging-non-admin-${GITHUB_RUN_ID}.token"
          sudo -n -E -u saas-staging env \
            PYTHONPATH=/opt/saas-control-staging/current/backend \
            /opt/saas-control-staging/shared/backend-venv/bin/python \
            "$auth_script" \
            --email "$NON_ADMIN_SMOKE_EMAIL" \
            --token-file "$cleanup_token_file" \
            --cleanup
          sudo rm -f -- "$cleanup_token_file"

      - name: Remove exact Phase 2 synthetic browser records
        if: always()
        run: |
          cleanup_file="$GITHUB_WORKSPACE/staging-browser-evidence/phase2-cleanup.json"
          if [[ -f "$cleanup_file" ]]; then
            cleanup_copy="/tmp/saas-control-phase2-cleanup-${GITHUB_RUN_ID}.json"
            sudo install -m 644 -o saas-staging -g saas-staging "$cleanup_file" "$cleanup_copy"
            set -a
            . /opt/saas-control-staging/shared/env/staging-backend.env
            set +a
            sudo -n -E -u saas-staging env PYTHONPATH=/opt/saas-control-staging/current/backend \
              /opt/saas-control-staging/shared/backend-venv/bin/python \
              /opt/saas-control-staging/current/scripts/release/cleanup_phase2_synthetic.py \
              --file "$cleanup_copy"
            sudo rm -f -- "$cleanup_copy"
          else
            echo "No Phase 2 synthetic cleanup manifest was produced"
          fi

      - name: Remove exact Phase 3 synthetic browser records
        if: always()
        run: |
          cleanup_file="$GITHUB_WORKSPACE/staging-browser-evidence/phase3-cleanup.json"
          if [[ -f "$cleanup_file" ]]; then
            cleanup_copy="/tmp/saas-control-phase3-cleanup-${GITHUB_RUN_ID}.json"
            sudo install -m 644 -o saas-staging -g saas-staging "$cleanup_file" "$cleanup_copy"
            set -a
            . /opt/saas-control-staging/shared/env/staging-backend.env
            set +a
            sudo -n -E -u saas-staging env PYTHONPATH=/opt/saas-control-staging/current/backend \
              /opt/saas-control-staging/shared/backend-venv/bin/python \
              /opt/saas-control-staging/current/scripts/release/cleanup_phase2_synthetic.py \
              --file "$cleanup_copy"
            sudo rm -f -- "$cleanup_copy"
          else
            echo "No Phase 3 synthetic cleanup manifest was produced"
          fi

      - name: Reset synthetic ERP demo records and verify read-only zero counts
        if: always()
        env:
          OUTPUT_FILE: ${{ github.workspace }}/staging-browser-evidence/erp/erp-reset-evidence.json
        run: sudo bash "$GITHUB_WORKSPACE/scripts/release/erp_demo_cleanup.sh"

      - name: Write candidate-bound protected staging evidence manifest
        if: always()
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          RUNTIME_RELEASE_URL: http://127.0.0.1:18001/runtime/release
          EVIDENCE_DIR: ${{ github.workspace }}/staging-browser-evidence
        run: |
          if [[ ! -d "$EVIDENCE_DIR" ]]; then
            echo "No staging evidence directory was produced"
            exit 0
          fi
          export CUSTOM_APP_SHA="$(tr -d '\r\n' < ops/staging/lenerp_core/SOURCE_COMMIT.txt)"
          python3 - <<'PY'
          import json
          import hashlib
          import os
          import shutil
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.request import Request, urlopen

          evidence_dir = Path(os.environ["EVIDENCE_DIR"])
          candidate_sha = os.environ["CANDIDATE_SHA"]
          custom_app_sha = os.environ["CUSTOM_APP_SHA"]
          runtime_url = os.environ["RUNTIME_RELEASE_URL"]
          request = Request(runtime_url, headers={"Host": "staging.example.test"})
          with urlopen(request, timeout=20) as response:
              runtime_readback = json.load(response)
          if runtime_readback.get("release_id") != candidate_sha or runtime_readback.get("commit") != candidate_sha:
              raise SystemExit("runtime readback is not bound to the candidate SHA")
          manifest = runtime_readback.get("manifest") or {}
          observed_app_sha = runtime_readback.get("custom_app_commit") or manifest.get("custom_app_commit")
          if observed_app_sha != custom_app_sha:
              raise SystemExit("runtime readback is not bound to the pinned custom app SHA")
          documentation_source = Path(os.environ["GITHUB_WORKSPACE"]) / "docs" / "champion_execution" / "FINAL_REMEDIATION_EVIDENCE.md"
          if not documentation_source.is_file():
              raise SystemExit("candidate-bound remediation documentation is missing")
          documentation_target = evidence_dir / "documentation" / documentation_source.name
          documentation_target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(documentation_source, documentation_target)
          documentation_sha256 = hashlib.sha256(documentation_source.read_bytes()).hexdigest()
          files = sorted(
              str(path.relative_to(evidence_dir)).replace(os.sep, "/")
              for path in evidence_dir.rglob("*")
              if path.is_file()
          )
          evidence_manifest = {
              "candidate_sha": candidate_sha,
              "custom_app_sha": custom_app_sha,
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "artifact_name": f"staging-browser-evidence-{candidate_sha}",
              "captured_at_utc": datetime.now(timezone.utc).isoformat(),
              "runtime_readback": runtime_readback,
              "release_manifest": manifest,
              "documentation": {
                  "source_path": str(documentation_source.relative_to(Path(os.environ["GITHUB_WORKSPACE"]))).replace(os.sep, "/"),
                  "artifact_path": str(documentation_target.relative_to(evidence_dir)).replace(os.sep, "/"),
                  "sha256": documentation_sha256,
                  "candidate_sha": candidate_sha,
              },
              "files": files,
          }
          (evidence_dir / "candidate-bound-evidence-manifest.json").write_text(
              json.dumps(evidence_manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload durable staging browser evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: staging-browser-evidence-${{ steps.candidate.outputs.sha }}
          path: staging-browser-evidence
          if-no-files-found: error
          retention-days: 30
