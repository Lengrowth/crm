name: Build and deploy SaaS control plane to staging

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Exact candidate ref to build and browser-validate (defaults to the workflow commit)
        required: false
        default: ""
        type: string
      rollout_stage:
        description: Rollout evidence stage recorded in the durable browser artifact
        required: false
        default: "operator-validation"
        type: choice
        options:
          - "operator-validation"
          - "general"
      phase1_shell_state:
        description: Staging-only shell state for candidate browser evidence
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - "on"
      phase4_synthetic_state:
        description: Staging-only Phase 4 public/operator synthetic workflow state
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - "on"

permissions:
  contents: read

concurrency:
  group: saas-control-staging-deploy
  cancel-in-progress: false

jobs:
  staging:
    name: Build one immutable candidate and deploy staging
    runs-on:
      - self-hosted
      - linux
      - saas-control
    environment: staging
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}
          fetch-depth: 0

      - name: Resolve immutable candidate commit
        id: candidate
        run: |
          candidate_sha="$(git rev-parse HEAD)"
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Candidate checkout is not a commit: $candidate_sha" >&2; exit 1; }
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Verify the commit-pinned LenERP Core staging bundle
        run: |
          core_commit="$(tr -d '\r\n' < ops/staging/lenerp_core/SOURCE_COMMIT.txt)"
          test "$core_commit" = "b564f5a6e284fb1b092c31e8d4904b73fdad5db0"
          archive="ops/staging/lenerp_core-${core_commit}.tar"
          test -f "$archive"
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          staging = Path("ops/staging")
          expected, filename = staging.joinpath("lenerp_core.archive.sha256").read_text(encoding="utf-8").split()
          archive = staging / filename
          actual = sha256(archive.read_bytes()).hexdigest().upper()
          if actual != expected.upper():
              raise SystemExit(f"Archive checksum mismatch: expected {expected}, got {actual}")
          print(f"Verified {filename}: {actual}")
          PY
          exact_dir="$RUNNER_TEMP/lenerp_core-exact"
          rm -rf -- "$exact_dir"
          mkdir -p "$exact_dir"
          tar -xf "$archive" -C "$exact_dir"
          test -f "$exact_dir/lenerp_core/demo_seed.py"
          python3 -m compileall -q "$exact_dir/lenerp_core"
          EXACT_DIR="$exact_dir" python3 - <<'PY'
          import re
          import os
          from pathlib import Path
          text = (Path(os.environ['EXACT_DIR']) / 'pyproject.toml').read_text(encoding='utf-8')
          match = re.search(r'^version\s*=\s*["\']([^"\']+)', text, flags=re.MULTILINE)
          version = match.group(1) if match else None
          if version != '0.2.0':
              raise SystemExit(f'Unexpected bundled lenerp_core version: {version}')
          print(f'Bundled lenerp_core {version} validated')
          PY

      - name: Make release scripts executable
        run: chmod +x scripts/release/*.sh scripts/deploy/*.sh

      - name: Use the supported Node.js runtime for the locked frontend toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Reclaim only the disposable npm cache on the staging runner
        run: npm cache clean --force

      - name: Reclaim disposable npm and Next.js temp directories
        run: |
          sudo find /tmp -maxdepth 1 -mindepth 1 \( -name 'npm-*' -o -name 'next-*' \) -exec rm -rf -- {} +
          df -h / /home /opt

      - name: Reclaim only the older staging rollback release
        run: |
          release_root=/opt/saas-control-staging/releases
          current="$(readlink -f /opt/saas-control-staging/current 2>/dev/null || true)"
          previous="$(readlink -f /opt/saas-control-staging/previous 2>/dev/null || true)"
          if [[ -n "$previous" && "$previous" != "$current" && "$previous" == "$release_root/"* && -d "$previous" ]]; then
            sudo rm -rf -- "$previous"
            sudo rm -f -- /opt/saas-control-staging/previous
          fi
          df -h / /home /opt

      - name: Scan tracked and untracked candidate inputs for credential patterns
        run: python3 scripts/release/secret_scan.py

      - name: Remove only prior generated workspace outputs
        run: rm -rf -- "$GITHUB_WORKSPACE/frontend/node_modules" "$GITHUB_WORKSPACE/frontend/.next" "$GITHUB_WORKSPACE/staging-browser-evidence"

      - name: Retain only active and previous staging candidates
        run: |
          chmod +x scripts/release/prune_staging_releases.sh
          sudo scripts/release/prune_staging_releases.sh

      - name: Run candidate-bound validation suite
        env:
          SOURCE_REPO: ${{ github.workspace }}
          BACKEND_PYTHON: /opt/saas-control-staging/shared/backend-venv/bin/python
        run: |
          /opt/saas-control-staging/shared/backend-venv/bin/pip install --disable-pip-version-check --no-input 'pytest>=8,<9'
          ./scripts/release/validate_candidate.sh

      - name: Set staging-only shell flag for this candidate
        env:
          PHASE1_SHELL_STATE: ${{ inputs.phase1_shell_state || 'off' }}
        run: |
          case "$PHASE1_SHELL_STATE" in on|off) ;; *) echo "Invalid shell state" >&2; exit 1 ;; esac
          sudo python3 - /opt/saas-control-staging/shared/env/staging-backend.env "$PHASE1_SHELL_STATE" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          state = sys.argv[2]
          lines = path.read_text(encoding="utf-8").splitlines()
          output = []
          updated = False
          for line in lines:
              if line.startswith("FEATURE_FLAGS="):
                  entries = [entry for entry in line.removeprefix("FEATURE_FLAGS=").split(",") if entry and not entry.startswith("platform_phase1_shell=")]
                  entries.append(f"platform_phase1_shell={state}")
                  line = "FEATURE_FLAGS=" + ",".join(entries)
                  updated = True
              output.append(line)
          if not updated:
              output.append(f"FEATURE_FLAGS=platform_phase1_shell={state}")
          path.write_text("\n".join(output) + "\n", encoding="utf-8")
          PY

      - name: Set staging-only Phase 3 operator rollout flags
        env:
          ROLLOUT_STAGE: ${{ inputs.rollout_stage || 'operator-validation' }}
        run: |
          sudo python3 - /opt/saas-control-staging/shared/env/staging-backend.env "$ROLLOUT_STAGE" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          stage = sys.argv[2]
          if stage == 'general':
              values = ('on', 'off', 'on')
          else:
              values = ('on', 'on', 'off')
          lines = path.read_text(encoding='utf-8').splitlines()
          output = []
          updated = False
          for line in lines:
              if line.startswith('FEATURE_FLAGS='):
                  entries = [entry for entry in line.removeprefix('FEATURE_FLAGS=').split(',') if entry and not entry.split('=', 1)[0].strip().startswith('module_entitlement_')]
                  entries.extend([f'module_entitlement_writes={values[0]}', f'module_entitlement_operator_only={values[1]}', f'module_entitlement_general={values[2]}'])
                  line = 'FEATURE_FLAGS=' + ','.join(entries)
                  updated = True
              output.append(line)
          if not updated:
              output.append('FEATURE_FLAGS=' + ','.join([f'module_entitlement_writes={values[0]}', f'module_entitlement_operator_only={values[1]}', f'module_entitlement_general={values[2]}']))
          path.write_text('\n'.join(output) + '\n', encoding='utf-8')

      - name: Set staging-only Phase 4 synthetic rollout flags
        env:
          PHASE4_SYNTHETIC_STATE: ${{ inputs.phase4_synthetic_state || 'off' }}
        run: |
          case "$PHASE4_SYNTHETIC_STATE" in on|off) ;; *) echo "Invalid Phase 4 synthetic state" >&2; exit 1 ;; esac
          sudo python3 - /opt/saas-control-staging/shared/env/staging-backend.env "$PHASE4_SYNTHETIC_STATE" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          state = sys.argv[2]
          names = ('onboarding_public_intake', 'onboarding_operator_view', 'onboarding_conversion', 'onboarding_execution', 'onboarding_synthetic_allowlist')
          lines = path.read_text(encoding='utf-8').splitlines()
          output = []
          updated = False
          for line in lines:
              if line.startswith('FEATURE_FLAGS='):
                  entries = [entry for entry in line.removeprefix('FEATURE_FLAGS=').split(',') if entry and entry.split('=', 1)[0].strip() not in names and entry.split('=', 1)[0].strip() != 'onboarding_real_execution']
                  entries.extend([f'{name}={state}' for name in names])
                  entries.append('onboarding_real_execution=off')
                  line = 'FEATURE_FLAGS=' + ','.join(entries)
                  updated = True
              output.append(line)
          if not updated:
              output.append('FEATURE_FLAGS=' + ','.join([f'{name}={state}' for name in names] + ['onboarding_real_execution=off']))
          path.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY

      - name: Configure the dedicated staging Frappe bench adapter
        env:
          STAGING_MARIADB_ROOT_USERNAME: ${{ secrets.STAGING_MARIADB_ROOT_USERNAME }}
          STAGING_MARIADB_ROOT_PASSWORD: ${{ secrets.STAGING_MARIADB_ROOT_PASSWORD }}
        run: |
          db_root_username="saas_phase4_bench"
          db_root_password="$(openssl rand -hex 32)"
          mariadb_socket_admin="false"
          if [[ -n "${STAGING_MARIADB_ROOT_PASSWORD:-}" ]]; then
            mariadb_root_username="${STAGING_MARIADB_ROOT_USERNAME:-root}"
            mariadb_root_password="$STAGING_MARIADB_ROOT_PASSWORD"
          else
            if mariadb_root_credential="$(sudo python3 - <<'PY'
          from configparser import ConfigParser, Error as ConfigParserError
          import json
          from pathlib import Path

          candidates = [
              Path('/root/.my.cnf'),
              Path('/home/frappe/.my.cnf'),
              Path('/home/ubuntu/.my.cnf'),
              Path('/etc/mysql/my.cnf'),
              Path('/etc/mysql/mariadb.cnf'),
              Path('/etc/mysql/debian.cnf'),
              Path('/opt/frappe-staging-bench/sites/common_site_config.json'),
              Path('/opt/frappe-staging-bench/config/common_site_config.json'),
              Path('/opt/frappe-staging-bench/sites/erp-staging.example.test/site_config.json'),
          ]
          candidates.extend(Path('/opt/frappe-staging-bench').glob('**/*.cnf'))
          candidates.extend(Path('/opt/frappe-staging-bench/sites').glob('**/*.json'))
          for path in candidates:
              if not path.is_file():
                  continue
              try:
                  if path.suffix == '.cnf':
                      parser = ConfigParser()
                      parser.read(path)
                      for section in ('client', 'mysql', 'mariadb'):
                          if parser.has_option(section, 'password'):
                              username = parser.get(section, 'user', fallback='root')
                              print(f"{username}\t{parser.get(section, 'password')}")
                              raise SystemExit(0)
                  else:
                      payload = json.loads(path.read_text(encoding='utf-8'))
                      for key in ('root_password', 'db_root_password', 'mariadb_root_password'):
                          value = payload.get(key) if isinstance(payload, dict) else None
                          if value:
                              username = payload.get('root_username', 'root') if isinstance(payload, dict) else 'root'
                              print(f"{username}\t{value}")
                              raise SystemExit(0)
              except (OSError, ValueError, ConfigParserError, json.JSONDecodeError):
                  continue
          raise SystemExit('No protected staging MariaDB root credential was found.')
          PY
            )"; then
              IFS=$'\t' read -r mariadb_root_username mariadb_root_password <<< "$mariadb_root_credential"
            elif sudo -n -u mysql mariadb --protocol=socket --batch --skip-column-names -e 'SELECT 1' >/dev/null 2>&1; then
              mariadb_socket_admin="true"
            else
              echo "No protected staging MariaDB root credential or Unix-socket admin was available." >&2
              exit 1
            fi
          fi
          if [[ "$mariadb_socket_admin" == "true" ]]; then
            run_mariadb_admin() { sudo -n -u mysql mariadb --protocol=socket --batch; }
          else
            [[ -n "$mariadb_root_username" && -n "$mariadb_root_password" ]] || { echo "Staging MariaDB root credential is unavailable" >&2; exit 1; }
            run_mariadb_admin() { sudo -n env MYSQL_PWD="$mariadb_root_password" mariadb --protocol=socket --user="$mariadb_root_username" --batch; }
          fi
          run_mariadb_admin <<SQL
          CREATE USER IF NOT EXISTS '${db_root_username}'@'localhost' IDENTIFIED BY '${db_root_password}';
          CREATE USER IF NOT EXISTS '${db_root_username}'@'%' IDENTIFIED BY '${db_root_password}';
          ALTER USER '${db_root_username}'@'localhost' IDENTIFIED BY '${db_root_password}';
          ALTER USER '${db_root_username}'@'%' IDENTIFIED BY '${db_root_password}';
          GRANT ALL PRIVILEGES ON *.* TO '${db_root_username}'@'localhost' WITH GRANT OPTION;
          GRANT ALL PRIVILEGES ON *.* TO '${db_root_username}'@'%' WITH GRANT OPTION;
          FLUSH PRIVILEGES;
          SQL
          sudo python3 - /opt/saas-control-staging/shared/env/staging-backend.env <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          required = {
              'ERPNEXT_MODE': 'bench',
              'ERPNEXT_BENCH_ROOT': '/opt/frappe-staging-bench',
              'ERPNEXT_BENCH_SITE_PREFIX': 'phase4-',
              'ERPNEXT_BENCH_RUN_AS_USER': 'frappe',
              'ERPNEXT_BENCH_COMMAND': '/usr/local/bin/bench',
              'ERPNEXT_BENCH_WEB_URL': 'http://127.0.0.1:28000',
          }
          lines = path.read_text(encoding='utf-8').splitlines()
          output = []
          seen = set()
          for line in lines:
              key, separator, _ = line.partition('=')
              if separator and key in required:
                  output.append(f'{key}={required[key]}')
                  seen.add(key)
              else:
                  output.append(line)
          output.extend(f'{key}={value}' for key, value in required.items() if key not in seen)
          path.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY
          sudo install -d -o root -g saas-staging -m 0750 /run/saas-control-staging
          sudo tee /run/saas-control-staging/frappe-bench.env >/dev/null <<EOF
          ERPNEXT_DB_ROOT_USERNAME=$db_root_username
          ERPNEXT_DB_ROOT_PASSWORD=$db_root_password
          EOF
          sudo chown root:saas-staging /run/saas-control-staging/frappe-bench.env
          sudo chmod 0640 /run/saas-control-staging/frappe-bench.env
          sudo install -m 0644 ops/staging/saas-control-staging-backend.service /etc/systemd/system/saas-control-staging-backend.service
          sudo install -m 0440 /dev/stdin /etc/sudoers.d/saas-staging-frappe-bench <<'EOF'
          saas-staging ALL=(frappe) NOPASSWD: /usr/local/bin/bench
          EOF
          sudo visudo -cf /etc/sudoers.d/saas-staging-frappe-bench
          sudo systemctl daemon-reload
          sudo systemctl restart saas-control-staging-backend
          sudo systemctl restart saas-control-staging-worker
          sudo -n -u frappe /usr/local/bin/bench --version

      - name: Build and deploy exact candidate to staging
        env:
          DEPLOY_TARGET: staging
          TARGET_REF: ${{ steps.candidate.outputs.sha }}
          RELEASE_ID: ${{ steps.candidate.outputs.sha }}
          CUSTOM_APP_VERSION: "0.2.0"
          CUSTOM_APP_COMMIT: "b564f5a6e284fb1b092c31e8d4904b73fdad5db0"
          REQUIRE_AUTH_SMOKE: "true"
        run: ./scripts/deploy/deploy_saas_control.sh

      - name: Install and migrate the exact custom app from the pinned staging bundle
        run: |
          core_commit="$(tr -d '\r\n' < ops/staging/lenerp_core/SOURCE_COMMIT.txt)"
          exact_dir="$RUNNER_TEMP/lenerp_core-exact"
          test -d "$exact_dir"
          test "$core_commit" = "b564f5a6e284fb1b092c31e8d4904b73fdad5db0"
          sudo rsync -a --delete --exclude='.git' "$exact_dir/" /opt/frappe-staging-bench/apps/lenerp_core/
          sudo chown -R frappe:frappe /opt/frappe-staging-bench/apps/lenerp_core
          if ! sudo -u frappe bash -lc "cd /opt/frappe-staging-bench && bench --site erp-staging.example.test list-apps | grep -Eq '^lenerp_core[[:space:]]'"; then
            sudo -u frappe bash -lc "cd /opt/frappe-staging-bench && bench --site erp-staging.example.test install-app lenerp_core"
          fi
          sudo -u frappe bash -lc "cd /opt/frappe-staging-bench && bench --site erp-staging.example.test migrate"
          sudo systemctl restart frappe-staging-web.service frappe-staging-worker-short.service frappe-staging-schedule.service

      - name: Verify the dedicated ERP staging bench and queues
        run: sudo scripts/release/erp_staging_smoke.sh

      - name: Run the persisted Champion synthetic ERP demonstration smoke
        env:
          KEEP_DEMO: "1"
          EXPECTED_CUSTOM_APP_VERSION: "0.2.0"
        run: sudo scripts/release/erp_demo_smoke.sh

      - name: Create real ERP role principals and verify permissions
        env:
          RUN_ID: ${{ github.run_id }}
          ROLE_PASSWORD_FILE: /run/saas-control-staging/erp-role-password-${{ github.run_id }}
          ROLE_EMAIL_PREFIX: champion-demo-role-${{ github.run_id }}
          OUTPUT_FILE: ${{ github.workspace }}/staging-browser-evidence/erp-role-permission-evidence.json
        run: |
          sudo env RUN_ID="$RUN_ID" ROLE_PASSWORD_FILE="$ROLE_PASSWORD_FILE" ROLE_EMAIL_PREFIX="$ROLE_EMAIL_PREFIX" OUTPUT_FILE="$OUTPUT_FILE" scripts/release/erp_role_smoke.sh
          sudo install -m 600 -o "$(id -u)" -g "$(id -g)" "$ROLE_PASSWORD_FILE" "$RUNNER_TEMP/erp-role-password-${{ github.run_id }}"

      - name: Run isolated synthetic Phase 4 onboarding smoke
        if: ${{ (inputs.phase4_synthetic_state || 'off') == 'on' }}
        env:
          RUN_ID: phase4-${{ github.run_id }}
        run: |
          token_file=/run/saas-control-staging/smoke/auth-token
          evidence_file="/tmp/phase4-synthetic-evidence-${RUN_ID}.json"
          trap 'sudo rm -f -- "$evidence_file"' EXIT
          set +e
          sudo -n -u saas-staging env RUN_ID="$RUN_ID" TOKEN_FILE="$token_file" EVIDENCE_FILE="$evidence_file" bash -c '
            set -a
            . /opt/saas-control-staging/shared/env/staging-backend.env
            . /run/saas-control-staging/frappe-bench.env
            set +a
            PYTHONPATH=/opt/saas-control-staging/current/backend \
              /opt/saas-control-staging/shared/backend-venv/bin/python \
              /opt/saas-control-staging/current/scripts/release/phase4_synthetic_smoke.py \
              --base-url http://127.0.0.1:18001 \
              --admin-token-file "$TOKEN_FILE" \
              --run-id "$RUN_ID" \
              --output "$EVIDENCE_FILE"
          '
          smoke_status=$?
          set -e
          if [[ -f "$evidence_file" ]]; then
            sudo install -m 644 -o "$(id -u)" -g "$(id -g)" "$evidence_file" "$GITHUB_WORKSPACE/phase4-synthetic-evidence.json"
          else
            echo "Phase 4 smoke did not produce an evidence file" >&2
          fi
          if [[ "$smoke_status" -ne 0 ]]; then exit "$smoke_status"; fi

      - name: Run controlled Phase 4 failure and recovery smoke
        if: ${{ (inputs.phase4_synthetic_state || 'off') == 'on' }}
        env:
          RUN_ID: phase4-recovery-${{ github.run_id }}
        run: |
          token_file=/run/saas-control-staging/smoke/auth-token
          evidence_file="/tmp/phase4-synthetic-recovery-evidence-${RUN_ID}.json"
          trap 'sudo rm -f -- "$evidence_file"' EXIT
          set +e
          sudo -n -u saas-staging env RUN_ID="$RUN_ID" TOKEN_FILE="$token_file" EVIDENCE_FILE="$evidence_file" bash -c '
            set -a
            . /opt/saas-control-staging/shared/env/staging-backend.env
            . /run/saas-control-staging/frappe-bench.env
            set +a
            PYTHONPATH=/opt/saas-control-staging/current/backend \
              /opt/saas-control-staging/shared/backend-venv/bin/python \
              /opt/saas-control-staging/current/scripts/release/phase4_synthetic_smoke.py \
              --base-url http://127.0.0.1:18001 \
              --admin-token-file "$TOKEN_FILE" \
              --run-id "$RUN_ID" \
              --failure-step health_checks \
              --output "$EVIDENCE_FILE"
          '
          smoke_status=$?
          set -e
          if [[ -f "$evidence_file" ]]; then
            sudo install -m 644 -o "$(id -u)" -g "$(id -g)" "$evidence_file" "$GITHUB_WORKSPACE/phase4-synthetic-recovery-evidence.json"
          else
            echo "Phase 4 recovery smoke did not produce an evidence file" >&2
          fi
          if [[ "$smoke_status" -ne 0 ]]; then exit "$smoke_status"; fi

      - name: Bind Phase 4 evidence to the exact candidate and staging run
        if: ${{ always() && (inputs.phase4_synthetic_state || 'off') == 'on' }}
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          python3 - "$GITHUB_WORKSPACE/phase4-synthetic-evidence-metadata.json" <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone

          candidate_sha = os.environ["CANDIDATE_SHA"]
          if len(candidate_sha) != 40 or any(char not in "0123456789abcdef" for char in candidate_sha):
              raise SystemExit("candidate SHA is not a full lowercase commit SHA")
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "evidence_version": 2,
                      "candidate_sha": candidate_sha,
                      "staging_run_id": int(os.environ["GITHUB_RUN_ID"]),
                      "workflow_file": ".github/workflows/deploy-saas-control.yml",
                      "success_evidence_file": "phase4-synthetic-evidence.json",
                      "recovery_evidence_file": "phase4-synthetic-recovery-evidence.json",
                      "bound_at_utc": datetime.now(timezone.utc).isoformat(),
                  },
                  handle,
                  indent=2,
                  sort_keys=True,
              )
          with open(sys.argv[1], encoding="utf-8") as handle:
              json.load(handle)
          PY

      - name: Upload non-secret Phase 4 synthetic evidence
        if: ${{ always() && (inputs.phase4_synthetic_state || 'off') == 'on' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase4-synthetic-evidence-${{ github.run_id }}
          path: |
            phase4-synthetic-evidence.json
            phase4-synthetic-recovery-evidence.json
            phase4-synthetic-evidence-metadata.json
          if-no-files-found: error
          retention-days: 30

      - name: Install browser runtime for durable staging evidence
        run: /opt/saas-control-staging/current/frontend/node_modules/.bin/playwright install --with-deps chromium

      - name: Prepare disposable non-admin route test identity
        env:
          NON_ADMIN_SMOKE_EMAIL: phase1-non-admin-${{ github.run_id }}@example.test
        run: |
          sudo install -d -o saas-staging -g saas-staging -m 700 /run/saas-control-staging/smoke
          set -a
          . /opt/saas-control-staging/shared/env/staging-backend.env
          set +a
          auth_script="/opt/saas-control-staging/current/scripts/release/prepare_staging_smoke_auth.py"
          sudo -n -E -u saas-staging env \
            PYTHONPATH=/opt/saas-control-staging/current/backend \
            STAGING_SMOKE_EMAIL="$NON_ADMIN_SMOKE_EMAIL" \
            /opt/saas-control-staging/shared/backend-venv/bin/python \
            "$auth_script" \
            --token-file /run/saas-control-staging/smoke/non-admin-auth-token \
            --non-admin

      - name: Capture candidate-bound browser and accessibility evidence
        # Keep this capture step adjacent to the deployed release dependencies.
        env:
          EXPECTED_PHASE_ONE_SHELL: ${{ inputs.phase1_shell_state || 'off' }}
          EXPECTED_RELEASE: ${{ steps.candidate.outputs.sha }}
          RUNTIME_RELEASE_URL: http://127.0.0.1:18001/runtime/release
          ROLLOUT_STAGE: ${{ inputs.rollout_stage || 'operator-validation' }}
          HEADLESS: "false"
          BASE_URL: http://127.0.0.1:13001
          HOST_HEADER: staging.example.test
          OUTPUT_DIR: ${{ github.workspace }}/staging-browser-evidence
        run: |
          token_file="$RUNNER_TEMP/saas-staging-smoke-token"
          non_admin_token_file="$RUNNER_TEMP/saas-staging-non-admin-token"
          sudo install -m 600 -o "$(id -u)" -g "$(id -g)" /run/saas-control-staging/smoke/auth-token "$token_file"
          sudo install -m 600 -o "$(id -u)" -g "$(id -g)" /run/saas-control-staging/smoke/non-admin-auth-token "$non_admin_token_file"
          browser_path="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*/chrome*/chrome' -print -quit 2>/dev/null || true)"
          [[ -n "$browser_path" ]] || { echo "Installed Chromium executable was not found" >&2; exit 1; }
          evidence_script="/opt/saas-control-staging/current/frontend/scripts/capture_browser_evidence.mjs"
          AUTH_TOKEN_FILE="$token_file" NON_ADMIN_AUTH_TOKEN_FILE="$non_admin_token_file" BROWSER_EXECUTABLE_PATH="$browser_path" node "$evidence_script"
          rm -f -- "$token_file" "$non_admin_token_file"

      - name: Capture authenticated ERP browser, print, export, and responsive evidence
        env:
          ERP_BASE_URL: http://127.0.0.1:28000
          ERP_HOST_HEADER: erp-staging.example.test
          ERP_ROLE_EMAIL_PREFIX: champion-demo-role-${{ github.run_id }}
          ERP_ROLE_PASSWORD_FILE: ${{ runner.temp }}/erp-role-password-${{ github.run_id }}
          OUTPUT_DIR: ${{ github.workspace }}/staging-browser-evidence/erp
          HEADLESS: "true"
        run: |
          browser_path="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*/chrome*/chrome' -print -quit 2>/dev/null || true)"
          [[ -n "$browser_path" ]] || { echo "Installed Chromium executable was not found" >&2; exit 1; }
          BROWSER_EXECUTABLE_PATH="$browser_path" node frontend/scripts/capture_erp_browser_evidence.mjs

      - name: Remove synthetic ERP role principals
        if: always()
        env:
          ROLE_PASSWORD_FILE: /run/saas-control-staging/erp-role-password-${{ github.run_id }}
          ROLE_EMAIL_PREFIX: champion-demo-role-${{ github.run_id }}
        run: |
          sudo -u frappe env DEMO_ROLE_PASSWORD_FILE="$ROLE_PASSWORD_FILE" DEMO_ROLE_EMAIL_PREFIX="$ROLE_EMAIL_PREFIX" bash -lc 'cd /opt/frappe-staging-bench && bench --site erp-staging.example.test execute lenerp_core.permission_smoke.cleanup'
          sudo rm -f -- "$ROLE_PASSWORD_FILE"
          rm -f -- "$RUNNER_TEMP/erp-role-password-${{ github.run_id }}"

      - name: Remove disposable non-admin route test identity
        if: always()
        env:
          NON_ADMIN_SMOKE_EMAIL: phase1-non-admin-${{ github.run_id }}@example.test
        run: |
          sudo install -d -o saas-staging -g saas-staging -m 700 /run/saas-control-staging/smoke
          set -a
          . /opt/saas-control-staging/shared/env/staging-backend.env
          set +a
          auth_script="/opt/saas-control-staging/current/scripts/release/prepare_staging_smoke_auth.py"
          cleanup_token_file="/tmp/saas-control-staging-non-admin-${GITHUB_RUN_ID}.token"
          sudo -n -E -u saas-staging env \
            PYTHONPATH=/opt/saas-control-staging/current/backend \
            /opt/saas-control-staging/shared/backend-venv/bin/python \
            "$auth_script" \
            --email "$NON_ADMIN_SMOKE_EMAIL" \
            --token-file "$cleanup_token_file" \
            --cleanup
          sudo rm -f -- "$cleanup_token_file"

      - name: Remove exact Phase 2 synthetic browser records
        if: always()
        run: |
          cleanup_file="$GITHUB_WORKSPACE/staging-browser-evidence/phase2-cleanup.json"
          if [[ -f "$cleanup_file" ]]; then
            cleanup_copy="/tmp/saas-control-phase2-cleanup-${GITHUB_RUN_ID}.json"
            sudo install -m 644 -o saas-staging -g saas-staging "$cleanup_file" "$cleanup_copy"
            set -a
            . /opt/saas-control-staging/shared/env/staging-backend.env
            set +a
            sudo -n -E -u saas-staging env PYTHONPATH=/opt/saas-control-staging/current/backend \
              /opt/saas-control-staging/shared/backend-venv/bin/python \
              /opt/saas-control-staging/current/scripts/release/cleanup_phase2_synthetic.py \
              --file "$cleanup_copy"
            sudo rm -f -- "$cleanup_copy"
          else
            echo "No Phase 2 synthetic cleanup manifest was produced"
          fi

      - name: Remove exact Phase 3 synthetic browser records
        if: always()
        run: |
          cleanup_file="$GITHUB_WORKSPACE/staging-browser-evidence/phase3-cleanup.json"
          if [[ -f "$cleanup_file" ]]; then
            cleanup_copy="/tmp/saas-control-phase3-cleanup-${GITHUB_RUN_ID}.json"
            sudo install -m 644 -o saas-staging -g saas-staging "$cleanup_file" "$cleanup_copy"
            set -a
            . /opt/saas-control-staging/shared/env/staging-backend.env
            set +a
            sudo -n -E -u saas-staging env PYTHONPATH=/opt/saas-control-staging/current/backend \
              /opt/saas-control-staging/shared/backend-venv/bin/python \
              /opt/saas-control-staging/current/scripts/release/cleanup_phase2_synthetic.py \
              --file "$cleanup_copy"
            sudo rm -f -- "$cleanup_copy"
          else
            echo "No Phase 3 synthetic cleanup manifest was produced"
          fi

      - name: Reset synthetic ERP demo records and verify read-only zero counts
        if: always()
        env:
          OUTPUT_FILE: ${{ github.workspace }}/staging-browser-evidence/erp/erp-reset-evidence.json
        run: sudo scripts/release/erp_demo_cleanup.sh

      - name: Upload durable staging browser evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: staging-browser-evidence-${{ steps.candidate.outputs.sha }}
          path: staging-browser-evidence
          if-no-files-found: error
          retention-days: 30
