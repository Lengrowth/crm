name: Verify pinned upstream Frappe and ERPNext trees

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Fail on dirty or unpinned upstream trees
    runs-on:
      - self-hosted
      - linux
      - saas-control
    steps:
      - name: Check out release guards
        uses: actions/checkout@v4

      - name: Verify upstream trees
        env:
          UPSTREAM_FRAPPE_DIR: ${{ vars.UPSTREAM_FRAPPE_DIR }}
          UPSTREAM_ERPNEXT_DIR: ${{ vars.UPSTREAM_ERPNEXT_DIR }}
          UPSTREAM_FRAPPE_COMMIT: ${{ vars.UPSTREAM_FRAPPE_COMMIT }}
          UPSTREAM_ERPNEXT_COMMIT: ${{ vars.UPSTREAM_ERPNEXT_COMMIT }}
        run: |
          chmod +x scripts/release/verify_upstream_clean.sh
          ./scripts/release/verify_upstream_clean.sh
