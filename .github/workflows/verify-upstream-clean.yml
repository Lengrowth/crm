name: Verify pinned upstream Frappe and ERPNext trees

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reclaim:
    name: Reclaim disposable staging runner contents
    runs-on:
      - self-hosted
      - linux
      - saas-control
    steps:
      - name: Remove only disposable runner and staging cache contents
        run: |
          set -euo pipefail
          sudo find /home/ubuntu/actions-runner/_work/_actions -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          sudo find /home/ubuntu/actions-runner/_work/_temp -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          sudo find /home/ubuntu/actions-runner/_diag -type f -name '*.log' -delete
          sudo find /tmp -maxdepth 1 -mindepth 1 \( -name 'npm-*' -o -name 'next-*' \) -exec rm -rf -- {} +
          sudo bash /opt/saas-control-staging/current/scripts/release/prune_staging_releases.sh
          df -h / /home /opt
