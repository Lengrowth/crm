name: Explicitly promote tested SaaS control plane release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Existing immutable candidate ID already tested in staging
        required: true
        type: string
      production_backup_verified:
        description: Confirm the application/site backup was verified for this promotion
        required: true
        type: choice
        options:
          - "no"
          - "yes"
      offhost_backup_verified:
        description: Confirm the authorized off-host backup copy was verified
        required: true
        type: choice
        options:
          - "no"
          - "yes"
      phase1_shell_state:
        description: Set the server-controlled operator shell flag for this promotion
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - "on"

permissions:
  contents: read

concurrency:
  group: saas-control-production-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Promote approved candidate to production
    runs-on:
      - self-hosted
      - linux
      - saas-control
    environment: production
    steps:
      - name: Check out release tooling
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Make release scripts executable
        run: chmod +x scripts/release/*.sh scripts/deploy/*.sh

      - name: Materialize the exact tested staging candidate
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: ./scripts/release/materialize_production_candidate.sh

      - name: Prepare disposable authenticated smoke identity
        env:
          SMOKE_EMAIL: phase0-production-smoke-${{ github.run_id }}@example.test
          SMOKE_ORGANIZATION: Phase 0 Production Smoke ${{ github.run_id }}
          TOKEN_FILE: /run/saas-control/smoke/auth-token
        run: |
          sudo install -d -o ubuntu -g ubuntu -m 700 /run/saas-control/smoke
          set -a
          . /opt/saas-control/shared/env/backend.env
          set +a
          PYTHONPATH=/opt/saas-control/current/backend \
            /opt/saas-control/shared/backend-venv/bin/python \
            scripts/release/production_smoke_auth.py prepare \
            --email "$SMOKE_EMAIL" \
            --organization "$SMOKE_ORGANIZATION" \
            --token-file "$TOKEN_FILE"

      - name: Apply requested server-controlled shell flag
        env:
          PHASE1_SHELL_STATE: ${{ inputs.phase1_shell_state }}
        run: |
          case "$PHASE1_SHELL_STATE" in
            on|off) ;;
            *) echo "Invalid Phase 1 shell state" >&2; exit 1 ;;
          esac
          sudo python3 - /opt/saas-control/shared/env/backend.env "$PHASE1_SHELL_STATE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          state = sys.argv[2]
          lines = path.read_text(encoding="utf-8").splitlines()
          updated = False
          output = []
          for line in lines:
              if not line.startswith("FEATURE_FLAGS="):
                  output.append(line)
                  continue
              entries = [entry for entry in line.removeprefix("FEATURE_FLAGS=").split(",") if entry and not entry.startswith("platform_phase1_shell=")]
              entries.append(f"platform_phase1_shell={state}")
              output.append("FEATURE_FLAGS=" + ",".join(entries))
              updated = True
          if not updated:
              output.append(f"FEATURE_FLAGS=platform_phase1_shell={state}")
          path.write_text("\n".join(output) + "\n", encoding="utf-8")
          PY

      - name: Promote only the requested tested candidate
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          PRODUCTION_PROMOTION_APPROVED: yes
          PRODUCTION_BACKUP_VERIFIED: ${{ inputs.production_backup_verified }}
          OFFHOST_BACKUP_VERIFIED: ${{ inputs.offhost_backup_verified }}
          REQUIRE_AUTH_SMOKE: "true"
          AUTH_TOKEN_FILE: /run/saas-control/smoke/auth-token
          PRODUCTION_BASE_URL: https://lenerp.lengrowth.com
          PRODUCTION_BACKEND_URL: https://lenerp-api.lengrowth.com
          RUN_SHELL_SMOKE: "true"
          EXPECTED_PHASE_ONE_SHELL: ${{ inputs.phase1_shell_state == 'on' }}
        run: ./scripts/deploy/promote_saas_control.sh

      - name: Run authorized Phase 2 production CRUD and tenant-isolation smoke
        env:
          PRODUCTION_BACKEND_URL: https://lenerp-api.lengrowth.com
          TOKEN_FILE: /run/saas-control/smoke/auth-token
        run: |
          set -a
          . /opt/saas-control/shared/env/backend.env
          set +a
          PYTHONPATH=/opt/saas-control/current/backend \
            /opt/saas-control/shared/backend-venv/bin/python \
            scripts/release/production_phase2_smoke.py \
            --token-file "$TOKEN_FILE"

      - name: Remove disposable authenticated smoke identity
        if: always()
        env:
          SMOKE_EMAIL: phase0-production-smoke-${{ github.run_id }}@example.test
          SMOKE_ORGANIZATION: Phase 0 Production Smoke ${{ github.run_id }}
          TOKEN_FILE: /run/saas-control/smoke/auth-token
        run: |
          set -a
          . /opt/saas-control/shared/env/backend.env
          set +a
          PYTHONPATH=/opt/saas-control/current/backend \
            /opt/saas-control/shared/backend-venv/bin/python \
            scripts/release/production_smoke_auth.py cleanup \
            --email "$SMOKE_EMAIL" \
            --organization "$SMOKE_ORGANIZATION"
          rm -f -- "$TOKEN_FILE"

      - name: Capture non-secret production readback
        if: always()
        run: |
          chmod +x scripts/release/capture_production_readback.sh
          sudo scripts/release/capture_production_readback.sh "$GITHUB_WORKSPACE/production-readback.json"
          sudo chown "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/production-readback.json"

      - name: Upload non-secret production readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-readback-${{ github.run_id }}
          path: production-readback.json
          if-no-files-found: error
          retention-days: 30
