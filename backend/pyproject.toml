[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saas-control-backend"
version = "0.1.0"
description = "FastAPI backend for the SaaS control layer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "alembic>=1.13,<2.0",
  "email-validator>=2.0,<3.0",
  "pydantic-settings>=2.0,<3.0",
  "psycopg[binary]>=3.1,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "httpx>=0.24,<1.0",
  "respx>=0.20,<1.0",
  "stripe>=5.0,<7.0"
]

[tool.setuptools.packages.find]
include = ["app*"]
