[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lenerp_core"
version = "0.3.0"
description = "LenERP custom Frappe application boundary"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["lenerp_core*"]

[tool.setuptools.package-data]
lenerp_core = ["**/*.html", "**/*.json", "**/*.js"]
